<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00a85a"><title>Keranjang | Toko Siap Antar</title><style>:root{--g:#00a85a;--c:#00c8a0;--y:#ffd400;--ink:#18312b;--muted:#66756f;--line:#dceee5}*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:var(--ink);font:15px Arial,sans-serif;padding-bottom:82px}header{background:#fff;border-bottom:2px solid var(--y);padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0000000b}header img{width:48px;height:44px;object-fit:contain}header strong{color:#008b4c;font-size:17px}header small{display:block;color:var(--muted);font-size:12px;margin-top:3px}main{max-width:820px;margin:auto;padding:16px 12px}.title{margin:4px 0;font-size:23px}.sub{color:var(--muted);font-size:13px;margin:6px 0 16px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 7px #18312b08}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #edf4ef}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:12px}.price{font-weight:800;color:#008b4c}.btn{border:0;border-radius:10px;padding:12px 14px;background:linear-gradient(100deg,var(--g),var(--c));color:white;font-weight:700;cursor:pointer}.btn2{border:1px solid #b9e5ce;background:#effbf3;color:#087b45;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.danger{background:#fff0ed;color:#b42318;border:0;border-radius:9px;padding:8px 10px}.full{width:100%;margin-top:10px}input,textarea,select{display:block;width:100%;border:1px solid #cfe5d8;border-radius:10px;padding:12px;font:inherit;margin:6px 0 12px;background:#fff;color:var(--ink)}label{font-weight:700;font-size:13px}.note{padding:12px;border-radius:10px;background:#eef7ff;margin:10px 0;font-size:13px}.ok{background:#e5fff0;color:#087b45}.err{background:#fff0ed;color:#b42318}.empty{text-align:center;color:var(--muted);padding:28px 12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:9px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom a{text-decoration:none;color:#008b4c;font-size:19px;text-align:center;min-width:48px}.bottom small{display:block;font-size:10px;margin-top:3px}@media(max-width:480px){.title{font-size:20px}.card{padding:12px}header strong{font-size:15px}}</style></head><body><header><img src="logo3.png" alt="Logo Toko Siap Antar"><div><strong>Toko Siap Antar</strong><small>Belanja sparepart dan aksesori HP lebih mudah</small></div></header><main><h1 class="title">🛒 Keranjang Belanja</h1><p class="sub">Barang diambil dari keranjang index yang tersimpan di perangkat ini.</p><div id="items" class="card"><div class="empty">Memuat keranjang…</div></div><div id="summary" class="card" hidden><div class="row"><span>Jumlah barang</span><b id="qty">0 pcs</b></div><div class="row"><span>Total</span><b class="price" id="total">Rp 0</b></div><button id="checkout" class="btn full">Lanjut Checkout →</button><button class="btn2 full" onclick="location.href='index-akun.html'">＋ Tambah Produk</button></div></main><nav class="bottom"><a href="index-akun.html">⌂<small>Beranda</small></a><a href="keranjang-akun.html">🛒<small>Keranjang</small></a><a href="pesanan-akun.html">▤<small>Pesanan</small></a><a href="riwayat-akun.html">◷<small>Riwayat</small></a><a href="profil-akun.html">👤<small>Profil</small></a></nav><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,getDocs,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",authDomain:"teknisi-ponsel-maja.firebaseapp.com",projectId:"teknisi-ponsel-maja",storageBucket:"teknisi-ponsel-maja.firebasestorage.app",messagingSenderId:"835618012205",appId:"1:835618012205:web:95e41095d1a56c761d4ca4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupiah=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
function parsePrice(v){if(typeof v==='number')return v;let s=String(v??'').replace(/Rp/gi,'').replace(/\s/g,'').replace(/[^0-9,.-]/g,'');if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(s.includes('.')&&(s.split('.').length>2||s.split('.')[1]?.length===3))s=s.replace(/\./g,'');else if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return Number.isFinite(n)?n:0;}
function note(id,msg,type='info'){const el=$(id);if(el)el.innerHTML=`<div class="note ${type}">${esc(msg)}</div>`}
function goLogin(){location.href='profil-akun.html?next='+encodeURIComponent(location.pathname.split('/').pop()||'index.html')}
function cartRead(){try{return JSON.parse(localStorage.getItem('tsa_cart')||'[]').filter(x=>x&&x.name&&Number(x.qty)>0)}catch{return []}}
function nav(active=''){return `<nav class="bottom"><a href="index-akun.html">⌂<small>Beranda</small></a><a href="keranjang-akun.html">🛒<small>Keranjang</small></a><a href="pesanan-akun.html">▤<small>Pesanan</small></a><a href="riwayat-akun.html">◷<small>Riwayat</small></a><a href="profil-akun.html">👤<small>Profil</small></a></nav>`}

let cart=cartRead();function save(){localStorage.setItem('tsa_cart',JSON.stringify(cart));render()}function render(){cart=cart.filter(x=>x&&x.name&&Number(x.qty)>0);const el=$('items'),sum=$('summary');if(!cart.length){el.innerHTML='<div class="empty">🛒<br><b>Keranjang masih kosong</b><p>Pilih produk di halaman beranda.</p><a class="btn" href="index-akun.html">Mulai Belanja</a></div>';sum.hidden=true;return}el.innerHTML=cart.map((x,i)=>`<div class="row"><div style="flex:1;min-width:0"><b>${esc(x.name)}</b><div class="muted">${rupiah(parsePrice(x.price))} / pcs</div><div style="display:flex;gap:7px;align-items:center;margin-top:8px"><button class="btn2" data-a="minus" data-i="${i}">−</button><b>${Number(x.qty)||1}</b><button class="btn2" data-a="plus" data-i="${i}">+</button><button class="danger" data-a="del" data-i="${i}">Hapus</button></div></div><b>${rupiah(parsePrice(x.price)*(Number(x.qty)||1))}</b></div>`).join('');$('qty').textContent=cart.reduce((s,x)=>s+(Number(x.qty)||1),0)+' pcs';$('total').textContent=rupiah(cart.reduce((s,x)=>s+parsePrice(x.price)*(Number(x.qty)||1),0));sum.hidden=false} $('items').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;let i=+b.dataset.i;if(!cart[i])return;if(b.dataset.a==='minus')cart[i].qty=Math.max(0,(+cart[i].qty||1)-1);if(b.dataset.a==='plus')cart[i].qty=(+cart[i].qty||1)+1;if(b.dataset.a==='del'||cart[i].qty<=0)cart.splice(i,1);save()});$('checkout').onclick=()=>location.href='checkout-akun.html';render();</script></body></html>

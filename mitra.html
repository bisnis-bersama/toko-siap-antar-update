<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00a85a"><title>Mitra Antar | Toko Siap Antar</title><style>:root{--g:#00a85a;--c:#00c8a0;--y:#ffd400;--ink:#18312b;--muted:#66756f;--line:#dceee5}*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:var(--ink);font:15px Arial,sans-serif;padding-bottom:30px}header{background:#fff;border-bottom:2px solid var(--y);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}header img{width:48px;height:44px;object-fit:contain}header strong{color:#008b4c;font-size:17px}header small{display:block;color:var(--muted);font-size:12px;margin-top:3px}main{max-width:900px;margin:auto;padding:16px 12px}.title{margin:4px 0;font-size:23px}.sub,.muted{color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 7px #18312b08}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf4ef;flex-wrap:wrap}.row:last-child{border-bottom:0}.btn{border:0;border-radius:10px;padding:11px 13px;background:linear-gradient(100deg,var(--g),var(--c));color:white;font-weight:700;cursor:pointer}.btn2{border:1px solid #b9e5ce;background:#effbf3;color:#087b45;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.danger{background:#fff0ed;color:#b42318;border:0;border-radius:9px;padding:9px 11px}input,select{display:block;width:100%;border:1px solid #cfe5d8;border-radius:10px;padding:12px;font:inherit;margin:7px 0 12px;background:#fff;color:var(--ink)}label{font-weight:700;font-size:13px}.note{padding:12px;border-radius:10px;background:#eef7ff;margin:10px 0;font-size:13px}.ok{background:#e5fff0;color:#087b45}.err{background:#fff0ed;color:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#fff7ce;font-size:12px;font-weight:700}.full{width:100%}a{color:#008b4c}@media(max-width:480px){.title{font-size:20px}.card{padding:12px}}</style></head><body><header><img src="logo3.png" alt="Logo Toko Siap Antar"><div><strong>Toko Siap Antar</strong><small>Panel mitra pengantaran</small></div></header><main><h1 class="title">🚚 Mitra Antar</h1><p class="sub">Login mitra, lihat pesanan yang ditugaskan, lalu perbarui status pengantaran.</p><div id="msg"></div><section id="login" class="card" hidden><h3>Login Mitra</h3><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn full">Login</button></form><p class="muted">Akun harus sudah dibuat di Firebase Authentication dan memiliki role <b>mitra</b> pada dokumen users/{UID}.</p></section><section id="panel" hidden><div class="card"><div class="row"><div><b id="mitraName">Mitra</b><div id="mitraEmail" class="muted"></div></div><button id="logout" class="btn2">Keluar</button></div><button id="refresh" class="btn2">Muat ulang pesanan</button></div><div id="orders"></div></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,query,where,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';const firebaseConfig = {
  apiKey: "AIzaSyBxqZhl6t3RwrXMwVdJeIkg0NzGfwvlweM",
  authDomain: "toko-siap-antar-9a7bb.firebaseapp.com",
  projectId: "toko-siap-antar-9a7bb",
  storageBucket: "toko-siap-antar-9a7bb.firebasestorage.app",
  messagingSenderId: "351335838712",
  appId: "1:351335838712:web:14cc2c7b91bb0c9e1b5c0d"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');let me=null,profile={};
function msg(t,err=false){$('msg').innerHTML=`<div class="note ${err?'err':'ok'}">${esc(t)}</div>`}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(x){msg(x.message||'Login gagal',true)}});$('logout').onclick=()=>signOut(auth);$('refresh').onclick=load;
onAuthStateChanged(auth,async u=>{me=u;if(!u){$('login').hidden=false;$('panel').hidden=true;return}try{const s=await getDoc(doc(db,'users',u.uid));profile=s.exists()?s.data():{};if(profile.role!=='mitra'){msg('Akses ditolak. Akun ini belum diberi role mitra.',true);await signOut(auth);return}$('login').hidden=true;$('panel').hidden=false;$('mitraName').textContent=profile.nama||u.displayName||'Mitra Antar';$('mitraEmail').textContent=u.email||'';await load()}catch(e){msg('Tidak dapat memeriksa akses. Pastikan rules Firestore mitra sudah ditambahkan. '+e.message,true)}});
async function load(){if(!me)return;$('orders').innerHTML='<div class="card">Memuat pesanan…</div>';try{const s=await getDocs(query(collection(db,'orders'),where('mitraUid','==',me.uid)));let a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.updatedAt?.seconds||y.createdAt?.seconds||0)-(x.updatedAt?.seconds||x.createdAt?.seconds||0));if(!a.length){$('orders').innerHTML='<div class="card">Belum ada pesanan yang ditugaskan kepada Anda.</div>';return}$('orders').innerHTML=a.map(o=>`<article class="card"><div class="row"><b>${esc(o.nomorPesanan||o.id)}</b><span class="badge">${esc(o.statusPengantaran||o.status||'DITUGASKAN')}</span></div><p><b>Penerima:</b> ${esc(o.alamatPengiriman?.nama||o.ownerName||'Pelanggan')}</p><p><b>Telepon:</b> ${esc(o.alamatPengiriman?.telepon||'-')}</p><p><b>Alamat:</b> ${esc(o.alamatPengiriman?.alamat||'Alamat belum tersedia')}</p><p><b>Pembayaran:</b> ${esc(o.metodePembayaran||'-')} · <b>Total:</b> ${money(o.total)}</p><div>${(o.items||[]).map(i=>`<div class="row"><span>${esc(i.nama||i.name)} × ${Number(i.qty)||1}</span><b>${money(i.subtotal??(Number(i.harga||i.price||0)*Number(i.qty||1)))}</b></div>`).join('')}</div><div class="grid"><button class="btn" data-id="${esc(o.id)}" data-status="DIAMBIL">Ambil tugas</button><button class="btn2" data-id="${esc(o.id)}" data-status="DALAM_PENGANTARAN">Sedang diantar</button><button class="btn2" data-id="${esc(o.id)}" data-status="SELESAI">Selesai diantar</button></div></article>`).join('')}catch(e){$('orders').innerHTML='';msg('Gagal membaca pesanan. Periksa rules Firestore untuk orders yang ditugaskan. '+e.message,true)}}
$('orders').addEventListener('click',async e=>{const b=e.target.closest('button[data-status]');if(!b)return;const label={DIAMBIL:'diambil',DALAM_PENGANTARAN:'sedang diantar',SELESAI:'selesai diantar'}[b.dataset.status];if(!confirm('Ubah status menjadi '+label+'?'))return;b.disabled=true;try{await updateDoc(doc(db,'orders',b.dataset.id),{statusPengantaran:b.dataset.status,updatedAt:serverTimestamp(),mitraLastUpdateBy:me.uid});msg('Status pengantaran diperbarui: '+label);await load()}catch(x){msg('Gagal mengubah status. Pastikan rules mengizinkan mitra memperbarui status pengantaran. '+x.message,true);b.disabled=false}});
</script></body></html>

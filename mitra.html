<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitra | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · MITRA</strong><nav><a href="mitra.html">Pesanan mitra</a><a href="index.html">Toko</a><button id="logoutBtn" class="dark">Keluar</button></nav></header><main class="shell"><section class="panel"><h1>Pesanan yang ditugaskan</h1><p class="muted" id="sessionLabel"></p><div id="notice" class="notice" hidden></div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Penerima</th><th>Alamat</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="orders"><tr><td colspan="6">Memuat…</td></tr></tbody></table></div></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";import {collection,query,where,getDocs,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {requireRole,money,esc,notice} from "./common.js";
requireRole(["mitra"],async user=>{document.querySelector("#sessionLabel").textContent=user.email||user.uid;try{const snap=await getDocs(query(collection(db,"orders"),where("mitraUid","==",user.uid)));const tb=document.querySelector("#orders");if(snap.empty){tb.innerHTML='<tr><td colspan="6">Belum ada pesanan yang ditugaskan.</td></tr>';return;}tb.innerHTML=snap.docs.map(d=>{const x=d.data();return `<tr><td>${esc(d.id)}</td><td>${esc(x.nama||"-")}<br>${esc(x.noWA||x.telepon||"")}</td><td>${esc(x.alamat||"-")}</td><td>${money(x.total)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.status==="dikirim"?`<button data-done="${esc(d.id)}">Tandai selesai</button>`:"-"}</td></tr>`}).join("");tb.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,"orders",b.dataset.done),{status:"selesai",completedAt:serverTimestamp(),updatedAt:serverTimestamp()});notice("Status selesai dikirim ke Firestore.","success");location.reload();}catch(e){notice("Rules saat ini hanya mengizinkan admin mengubah status pesanan. Minta admin menyelesaikan pesanan atau ubah Rules secara eksplisit untuk mitra.","error");}});}catch(e){notice("Gagal memuat pesanan: "+e.message,"error");}});
</script></body></html>

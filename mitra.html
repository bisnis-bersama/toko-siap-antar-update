<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitra | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · MITRA</strong><nav><a href="mitra.html">Pesanan mitra</a><a href="index.html">Toko</a><button id="logoutBtn" class="dark">Keluar</button></nav></header><main class="shell"><section class="panel"><h1>Pesanan yang ditugaskan</h1><p class="muted" id="sessionLabel"></p><div id="notice" class="notice" hidden></div><style>
/* Perbaikan khusus tabel pesanan mitra */
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-wrap table{min-width:760px;width:100%;border-collapse:collapse}
.table-wrap th,.table-wrap td{padding:12px 10px;vertical-align:top;overflow-wrap:anywhere}
.link-wa,.link-gps{color:#087f5b!important;text-decoration:underline;font-weight:700;overflow-wrap:anywhere}
.link-wa{white-space:nowrap}
</style>
<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Penerima</th><th>Alamat</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="orders"><tr><td colspan="6">Memuat…</td></tr></tbody></table></div></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";import {collection,query,where,getDocs,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {requireRole,money,esc,notice} from "./common.js";
requireRole(["mitra"],async user=>{document.querySelector("#sessionLabel").textContent=user.email||user.uid;try{const snap=await getDocs(query(collection(db,"orders"),where("mitraUid","==",user.uid)));const tb=document.querySelector("#orders");if(snap.empty){tb.innerHTML='<tr><td colspan="6">Belum ada pesanan yang ditugaskan.</td></tr>';return;}tb.innerHTML=snap.docs.map(d=>{
const x=d.data();
const phoneRaw=String(x.noWA||x.telepon||x.phone||"");
let phone=phoneRaw.replace(/\\D/g,"");
if(phone.startsWith("0")) phone="62"+phone.slice(1);
else if(phone.startsWith("8")) phone="62"+phone;
const waLink=phone?`<a class="link-wa" href="https://wa.me/${phone}" target="_blank" rel="noopener noreferrer">${esc(phoneRaw)}</a>`:"-";
const gpsRaw=x.gpsLink||x.lokasiGPS||x.lokasi||x.mapsUrl||x.googleMapsUrl||x.alamatGPS||"";
const gpsText=typeof gpsRaw==="string"?gpsRaw:(gpsRaw?.url||gpsRaw?.link||"");
const gpsUrl=/^https?:\\/\\//i.test(gpsText)?gpsText:"";
const address=String(x.alamat||x.alamatLengkap||x.alamatPengiriman||"-");
const addressHtml=gpsUrl
  ? `${esc(address)}<br><a class="link-gps" href="${esc(gpsUrl)}" target="_blank" rel="noopener noreferrer">📍 Buka lokasi GPS</a>`
  : `${esc(address)}${/Lokasi GPS HP:/i.test(address)?`<br><a class="link-gps" href="${esc((address.match(/https?:\\/\\/[^\\s]+/)||[])[0]||"#")}" target="_blank" rel="noopener noreferrer">📍 Buka lokasi GPS</a>`:""}`;
return `<tr><td>${esc(d.id)}</td><td>${esc(x.nama||x.penerima||"-")}<br>${waLink}</td><td>${addressHtml}</td><td>${money(x.total)}</td><td><span class="badge">${esc(x.status||x.statusPengantaran||"-")}</span></td><td>${(x.status==="dikirim"||x.statusPengantaran==="DIKIRIM")?`<button data-done="${esc(d.id)}">Tandai selesai</button>`:"-"}</td></tr>`
}).join("");tb.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,"orders",b.dataset.done),{status:"selesai",completedAt:serverTimestamp(),updatedAt:serverTimestamp()});notice("Status selesai dikirim ke Firestore.","success");location.reload();}catch(e){notice("Rules saat ini hanya mengizinkan admin mengubah status pesanan. Minta admin menyelesaikan pesanan atau ubah Rules secara eksplisit untuk mitra.","error");}});}catch(e){notice("Gagal memuat pesanan: "+e.message,"error");}});
</script></body></html>

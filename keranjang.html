<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getFirestore,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyBxqZhl6t3RwrXMwVdJeIkg0NzGfwvlweM",authDomain: "toko-siap-antar-9a7bb.firebaseapp.com",projectId: "toko-siap-antar-9a7bb",storageBucket: "toko-siap-antar-9a7bb.firebasestorage.app",messagingSenderId: "351335838712",appId: "1:351335838712:web:14cc2c7b91bb0c9e1b5c0d"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);


function hitungJarakKm(lat1,lng1,lat2,lng2){
  if(!lat1||!lng1||!lat2||!lng2) return null;
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function hitungOngkirFinal(jarakKm){
  if(jarakKm==null || jarakKm<0.05) return 0;
  if(jarakKm <= 3) return 5000;
  if(jarakKm <= 7) return 10000;
  if(jarakKm <= 12) return 15000;
  if(jarakKm <= 18) return 20000;
  if(jarakKm <= 24) return 30000;
  if(jarakKm <= 30) return 35000;
  return 35000 + Math.ceil(jarakKm - 30) * 1000;
}
async function cariMitraTerdekat(pLat,pLng,db,collection,query,where,getDocs){
  try{
    const q1 = query(collection(db,'users'), where('role','in',['mitra_usaha','mitra','toko','mitra usaha']));
    const snap1 = await getDocs(q1);
    let allMitra=[];
    snap1.forEach(d=>{ allMitra.push({id:d.id, ...d.data()}); });
    if(allMitra.length===0){
      const snapAll = await getDocs(collection(db,'users'));
      snapAll.forEach(d=>{
        const u=d.data();
        if((u.role||'').toLowerCase().includes('mitra')) allMitra.push({id:d.id, ...u});
      });
    }
    let terdekat=null; let jarakMin=Infinity;
    for(let m of allMitra){
      let mLat = m.tokoLat || m.toko_lat || m.lat || m.latitude || m.latToko || m.alamatToko?.lat || m.alamatPengiriman?.lat || m.lokasi?.lat;
      let mLng = m.tokoLng || m.toko_lng || m.lng || m.longitude || m.lngToko || m.alamatToko?.lng || m.alamatPengiriman?.lng || m.lokasi?.lng;
      if(!mLat || !mLng) continue;
      let jarak = hitungJarakKm(parseFloat(mLat), parseFloat(mLng), parseFloat(pLat), parseFloat(pLng));
      if(jarak!=null && jarak < jarakMin){
        jarakMin=jarak;
        terdekat={uid:m.id, nama:m.nama||m.namaToko||'Mitra', lat:parseFloat(mLat), lng:parseFloat(mLng), alamat:m.alamatToko||m.alamat||'', jarak:jarak};
      }
    }
    return terdekat;
  }catch(e){ console.error(e); return null; }
}


const rupiah=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
function cartRead(){try{return JSON.parse(localStorage.getItem('tsa_cart')||'[]')}catch{return []}}
let pLat=null,pLng=null,mitra=null,jarak=null,ongkir=5000;

async function getGPS(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej('No GPS');navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),e=>rej(e.message),{enableHighAccuracy:true,timeout:15000});});}

async function prosesGPS(lat,lng){
  pLat=lat; pLng=lng;
  const st=document.getElementById('gpsStatus');
  st.innerHTML=`📍 GPS Pelanggan: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>🔍 Mencari Mitra terdekat (GPS dari akun Mitra terdaftar)...`;
  st.className='note ok';
  mitra = await cariMitraTerdekat(lat,lng,db,collection,query,where,getDocs);
  if(!mitra){ st.innerHTML=`❌ Tidak ada akun Mitra dengan GPS.<br>Pastikan akun Mitra sudah isi lat/lng di profil.<br>GPS Pelanggan: ${lat.toFixed(6)}, ${lng.toFixed(6)}`; st.className='note err'; jarak=0; ongkir=5000; }
  else{ jarak=mitra.jarak; ongkir=hitungOngkirFinal(jarak); st.innerHTML=`✅ Lokasi berhasil disimpan.<br>Koordinat: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>Jarak garis lurus: ${jarak.toFixed(1)} km (Pelanggan → Mitra: ${mitra.nama})<br>Ongkos kirim: ${rupiah(ongkir)}<br>GPS Mitra (dari akun): ${mitra.lat.toFixed(6)}, ${mitra.lng.toFixed(6)}<br>Catatan: jarak ini estimasi GPS garis lurus, bukan jarak jalan.`; st.className='note ok'; }
  const data={lat:lat,lng:lng,jarakKm:jarak?parseFloat(jarak.toFixed(1)):0,ongkir:ongkir,mitraUid:mitra?.uid||'',mitraNama:mitra?.nama||'',mitraLat:mitra?.lat||null,mitraLng:mitra?.lng||null,gpsLink:`https://www.google.com/maps?q=${lat},${lng}`};
  localStorage.setItem('checkoutData', JSON.stringify(data));
  localStorage.setItem('tsa_jarak', jarak?jarak.toFixed(1):'0'); localStorage.setItem('tsa_ongkir', ongkir);
  render();
}

function render(){
  const cart=cartRead(); let total=cart.reduce((s,x)=>s+(Number(x.price)||0)*(Number(x.qty)||1),0);
  let htmlProd='';
  for(let i=0;i<cart.length;i++){
    let x=cart[i];
    htmlProd+=`<div class="prod"><div class="prod-img">📦</div><div style="flex:1;"><div class="prod-name">${x.name} <span style="background:#e6f7ef;color:#087443;border:1px solid #c3ead7;font-size:10px;padding:3px 8px;border-radius:999px;margin-left:6px;">✓ Ready</span></div><div class="prod-price">Rp ${Number(x.price).toLocaleString('id-ID')}</div><div class="qty"><button class="qbtn" onclick="ubahQty(${i},-1)">-</button><span class="qnum">${x.qty}</span><button class="qbtn" onclick="ubahQty(${i},1)">+</button><button class="hapus" onclick="hapus(${i})">Hapus</button></div><div class="subtotal">Subtotal: Rp ${((Number(x.price)||0)*(Number(x.qty)||1)).toLocaleString('id-ID')}</div></div></div>`;
  }
  document.getElementById('main').innerHTML=`
    <div class="card">${htmlProd}</div>
    <div class="card">
      <div class="row"><span>Total Barang</span><b>Rp ${total.toLocaleString('id-ID')}</b></div>
      <!-- Ongkir disembunyikan sementara sesuai permintaan -->
      <div class="row" style="display:none;"><span>Ongkir <span class="badge-km">${jarak?jarak.toFixed(1)+' km':'0-3 km'}</span></span><b>Rp ${ongkir.toLocaleString('id-ID')}</b></div>
      <div class="row" style="border-top:1px solid #eef2ee;margin-top:8px;padding-top:12px;"><span style="font-weight:900;">TOTAL BAYAR</span><span class="total-bayar">Rp ${total.toLocaleString('id-ID')}</span></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;"><button class="btn-tambah" onclick="location.href='index.html'">🛍️ Tambah Produk</button><button class="btn-kosong" onclick="kosongkan()">🗑️ Kosongkan</button></div>
    </div>
    <!-- Lokasi Pengiriman disembunyikan sementara sesuai permintaan -->
    <div class="card" style="display:none;">
      <div style="font-weight:900;margin-bottom:6px;">📍 Lokasi Pengiriman</div>
      <div class="muted">Ambil GPS HP untuk hitung jarak & ongkos kirim. Lokasi disimpan agar mitra bisa buka titik di Google Maps.<br><small>GPS Mitra diambil dari akun terdaftar Mitra.</small></div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"><button id="btnGPS" class="btn-gps">✅ Lokasi Tersimpan</button><a id="linkMaps" href="#" target="_blank" class="btn-maps" style="display:none;">🗺️ Buka lokasi di Google Maps</a></div>
      <div id="gpsStatus" class="note" style="margin-top:10px;">Belum ambil GPS.</div>
    </div>
  `;
  document.getElementById('bottomTotal').textContent=rupiah(total);
  document.getElementById('btnGPS').onclick=async()=>{
    const b=document.getElementById('btnGPS'); b.disabled=true; b.textContent='Mengambil GPS...';
    try{ const loc=await getGPS(); await prosesGPS(loc.lat,loc.lng); document.getElementById('linkMaps').href=`https://www.google.com/maps?q=${loc.lat},${loc.lng}`; document.getElementById('linkMaps').style.display='inline-block'; b.textContent='✅ Lokasi Tersimpan'; }catch(e){ document.getElementById('gpsStatus').innerHTML='❌ Gagal: '+e; document.getElementById('gpsStatus').className='note err'; }finally{ b.disabled=false; }
  };
  try{ const saved=JSON.parse(localStorage.getItem('checkoutData')||'null'); if(saved&&saved.lat){ pLat=saved.lat; pLng=saved.lng; jarak=saved.jarakKm; ongkir=saved.ongkir||5000; mitra={uid:saved.mitraUid,nama:saved.mitraNama,lat:saved.mitraLat,lng:saved.mitraLng,jarak:saved.jarakKm}; const el=document.getElementById('gpsStatus'); if(el){ el.innerHTML=`Lokasi berhasil disimpan.<br>Koordinat: ${saved.lat.toFixed(6)}, ${saved.lng.toFixed(6)}<br>Jarak garis lurus: ${saved.jarakKm} km<br>Ongkos kirim: Rp ${saved.ongkir.toLocaleString('id-ID')}<br>Mitra terdekat: ${saved.mitraNama||'-'} (GPS dari akun)<br>Catatan: jarak ini estimasi GPS garis lurus, bukan jarak jalan.`; el.className='note ok'; document.getElementById('linkMaps').href=saved.gpsLink; document.getElementById('linkMaps').style.display='inline-block'; } } }catch(e){}
}
window.ubahQty=(i,d)=>{ let c=cartRead(); c[i].qty=Math.max(1,(Number(c[i].qty)||1)+d); localStorage.setItem('tsa_cart', JSON.stringify(c)); render(); };
window.hapus=(i)=>{ let c=cartRead(); c.splice(i,1); localStorage.setItem('tsa_cart', JSON.stringify(c)); render(); };
window.kosongkan=()=>{ if(confirm('Kosongkan keranjang?')){ localStorage.setItem('tsa_cart','[]'); render(); } };
render();
</script>

<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#00a85a"><title>Keranjang - Toko Siap Antar</title><style>
:root{--green:#00a85a;--cyan:#00c8d7;--yellow:#ffd400;--ink:#18312b;--muted:#66756f;--paper:#f4fff7;--line:#dceee5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 2px 7px rgba(0,80,40,.08);padding:12px 15px;border-bottom:2px solid var(--yellow);display:flex;align-items:center;gap:12px}
header img{width:52px;height:48px;object-fit:contain;border-radius:10px}
header .brand{min-width:0;flex:1}header strong{display:block;color:#008b4c;font-size:16px}header small{display:block;color:#52635b;margin-top:4px;font-size:12px}
button,a{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px}
.back{background:#e8f8ee;color:#087b45;font-weight:700}
main{max-width:850px;margin:0 auto;padding:16px 12px}
.page-title{font-size:22px;margin:5px 0 4px}.subtitle{font-size:13px;color:var(--muted);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px #18312b0a}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf4ef}.item:last-child{border-bottom:0}
.item-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}.item-price{color:#008b4c;font-weight:800;margin-top:5px;font-size:13px}
.qty{display:flex;align-items:center;gap:9px;margin-top:9px}.qty button{width:30px;height:30px;padding:0;background:#eaf8ef;color:#007b42;font-weight:800}.qty .remove{background:#fff0ed;color:#b42318;width:auto;padding:0 9px;font-size:12px}
.summary-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}.total{font-size:18px;font-weight:800;color:#008b4c;border-top:1px solid var(--line);margin-top:7px;padding-top:13px}
.primary{width:100%;background:linear-gradient(100deg,#00a85a,#00bfae);color:white;font-weight:800;padding:14px;margin-top:10px}.secondary{background:#fff7ce;color:#292400;font-weight:700;width:100%;margin-top:8px}
.empty{text-align:center;padding:34px 15px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:10px}
label.field{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #cfe5d8;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#18312b;outline-color:#00a85a}textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12px;color:var(--muted);line-height:1.5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:20}.bottom-nav a{text-decoration:none;color:#008b4c;font-size:12px;font-weight:700}
@media(max-width:480px){header strong{font-size:14px}.page-title{font-size:20px}.grid2{grid-template-columns:1fr}.card{padding:12px}}
</style></head><body><header><button class="back" onclick="location.href='index-toko-siap-antar-updated.html'">←</button><img src="logo3.png" alt="Logo Toko Siap Antar"><div class="brand"><strong>Toko Siap Antar</strong><small>Belanja sparepart dan aksesori HP lebih mudah</small></div></header>
<main><h1 class="page-title">🛒 Keranjang Belanja</h1><p class="subtitle">Periksa produk dan jumlah pesanan sebelum checkout.</p>
<div id="cartItems" class="card"><div class="empty">Memuat keranjang…</div></div>
<div id="summary" class="card" hidden><div class="summary-row"><span>Jumlah produk</span><strong id="totalQty">0 pcs</strong></div><div class="summary-row total"><span>Total belanja</span><span id="totalPrice">Rp 0</span></div><button class="primary" id="checkoutBtn">Lanjut ke Checkout →</button><button class="secondary" onclick="location.href='index-toko-siap-antar-updated.html'">＋ Tambah Produk</button></div></main>
<nav class="bottom-nav"><a href="index-toko-siap-antar-updated.html">⌂ Home</a><a href="keranjang.html">🛒 Keranjang</a><a href="checkout.html">✓ Checkout</a></nav>
<script>
const KEY='tsa_cart';let cart=[];try{cart=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){cart=[]}
const money=v=>'Rp '+Math.max(0,Number(v)||0).toLocaleString('id-ID');
function price(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[^0-9,.-]/g,'').trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/\./g,'');let n=Number(s);return Number.isFinite(n)?n:0}
function save(){localStorage.setItem(KEY,JSON.stringify(cart));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const el=document.getElementById('cartItems'),sum=document.getElementById('summary');cart=cart.filter(x=>x&&x.name&&Number(x.qty)>0);
 if(!cart.length){el.innerHTML='<div class="empty"><div class="emoji">🛒</div><strong>Keranjang masih kosong</strong><p>Silakan pilih produk yang ingin dibeli.</p><button class="primary" onclick="location.href=\'index-toko-siap-antar-updated.html\'">Mulai Belanja</button></div>';sum.hidden=true;localStorage.setItem(KEY,'[]');return}
 el.innerHTML=cart.map((x,i)=>`<div class="item"><div><div class="item-name">${esc(x.name)}</div><div class="item-price">${money(price(x.price))} / pcs</div><div class="qty"><button data-act="minus" data-i="${i}">−</button><strong>${x.qty}</strong><button data-act="plus" data-i="${i}">+</button><button class="remove" data-act="remove" data-i="${i}">Hapus</button></div></div><strong>${money(price(x.price)*x.qty)}</strong></div>`).join('');
 document.getElementById('totalQty').textContent=cart.reduce((a,x)=>a+Number(x.qty),0)+' pcs';document.getElementById('totalPrice').textContent=money(cart.reduce((a,x)=>a+price(x.price)*Number(x.qty),0));sum.hidden=false;
}
document.getElementById('cartItems').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const i=Number(b.dataset.i);if(!cart[i])return;if(b.dataset.act==='plus')cart[i].qty++;if(b.dataset.act==='minus')cart[i].qty--;if(b.dataset.act==='remove'||cart[i].qty<=0)cart.splice(i,1);save()});
document.getElementById('checkoutBtn').onclick=()=>location.href='checkout.html';render();
</script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keranjang Belanja</title>
<meta name="viewport" content="width=device-width, initial-scale=1">


<style>

 :root{--green:#00a85a;--cyan:#00c8d7;--yellow:#ffd400;--ink:#18312b;--paper:#fffef0;--line:#dceee5}
*{box-sizing:border-box}
body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:var(--paper);
color:var(--ink);
padding-bottom:30px;
}
header{
background:#fff;
color:#008b4c;
padding:16px 12px;
text-align:center;
font-weight:800;
font-size:20px;
border-top:3px solid transparent;
border-bottom:3px solid transparent;
border-image:linear-gradient(90deg,#ffd400,#00a85a,#00c8d7,#a9d900,#ffd400) 1;
}

.card{
background:#fff;
margin:12px;
padding:14px;
border:1px solid var(--line);
border-radius:15px;
box-shadow:0 2px 7px #18312b12;
}

.harga{
color:#008b4c;
font-weight:bold;
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
margin:3px;
cursor:pointer;
}

.green{
background:linear-gradient(100deg,#00a85a,#00c8d7);
color:white;
}

.gray{
background:#9ca3af;
color:white;
}

.location-actions{margin:10px 12px}
.section-title{margin:18px 12px 8px;font-size:17px}
input{
display:block;
width:calc(100% - 24px);
margin:10px 12px;
padding:13px 12px;
border-radius:12px;
border:1px solid #a8dfc6;
background:#fff;
font-size:15px;
}
.checkout,.clearBtn{width:calc(100% - 24px);margin:10px 12px;}


.checkout{
display:block;
width:95%;
margin:10px;
background:linear-gradient(90deg,#16a34a,#f97316);
color:white;
padding:14px;
border-radius:10px;
border:none;
font-weight:bold;
font-size:16px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.clearBtn{
display:block;
width:95%;
margin:10px;
background:#f97316;
color:white;
padding:14px;
border-radius:10px;
border:none;
font-weight:bold;
font-size:16px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}


.location-actions button{padding:11px 14px;font-size:14px;border-radius:10px}
.checkout{background:linear-gradient(90deg,#00a85a,#00c8d7);color:#fff}
.clearBtn{background:#ffd400;color:#222}
@media(max-width:520px){
  header{font-size:18px}
  .card{margin:10px;padding:13px}
  .checkout,.clearBtn{width:calc(100% - 20px);margin:10px}
}
</style>
</head>

<body>

<header>🛒 Keranjang Belanja</header>

<div id="cartList"></div>

<h3 class="section-title">📍 Lokasi Pengiriman</h3>
<div class="location-actions">
  <button class="green" onclick="gunakanLokasi()">📡 Gunakan Lokasi Saya</button>
</div>

<div id="infoZona" class="card">
Belum memilih lokasi
</div>

<input type="text" id="namaPembeli" placeholder="Nama Pembeli">
<input type="tel" id="waPembeli" placeholder="Nomor WhatsApp Aktif">
<input type="text" id="manualLokasi"
placeholder="Alamat lengkap / Link Google Maps (isi jika GPS tidak akurat)">

<button class="checkout" onclick="lanjutBayar()">
Checkout
</button>

<button class="clearBtn" onclick="kosongkan()">
Kosongkan Keranjang
</button>
<script>

/* ================= DATA ================= */

const tokoLat = -6.883831;
const tokoLng = 108.302788;

// Index menyimpan pilihan di "tsa_cart" dengan properti name/price.
// Halaman ini memakai "cart" dengan properti nama/harga. Satukan keduanya agar
// produk yang dipilih di index otomatis muncul di halaman keranjang.
function parseHarga(value){
  if(typeof value === "number") return value;
  const cleaned = String(value ?? "").replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",",".");
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : 0;
}
function normalisasiCart(items){
  if(!Array.isArray(items)) return [];
  return items.map((p,i)=>({
    id:String(p.id ?? i),
    nama:String(p.nama ?? p.name ?? p.title ?? "Produk"),
    harga:parseHarga(p.harga ?? p.price ?? p.hargaJual ?? 0),
    qty:Math.max(1,parseInt(p.qty ?? p.jumlah ?? 1,10) || 1)
  }));
}
const cartLama = normalisasiCart(JSON.parse(localStorage.getItem("cart") || "[]"));
const cartIndex = normalisasiCart(JSON.parse(localStorage.getItem("tsa_cart") || "[]"));
let cart = cartIndex.length ? cartIndex : cartLama;
if(cart.length){
  localStorage.setItem("cart",JSON.stringify(cart));
}

let tujuanLat = null;
let tujuanLng = null;
let ongkir = 0;
let jarakFix = 0;
let minimalBelanja = 0;

let namaDesa="-";
let namaKecamatan="-";


/* ================= FORMAT RUPIAH ================= */

function rupiah(a){
return Math.round(a).toLocaleString("id-ID");
}

/* ================= RENDER CART ================= */

function renderCart(){

let list=document.getElementById("cartList");
list.innerHTML="";

let total=0;

cart.forEach((p,i)=>{

let sub=p.harga*p.qty;
total+=sub;

list.innerHTML+=`
<div class="card">

<b>${p.nama}</b><br>

<span class="harga">Rp ${rupiah(p.harga)}</span><br>

<button onclick="kurang(${i})">-</button>

${p.qty}

<button onclick="tambah(${i})">+</button>

<button onclick="hapus(${i})">Hapus</button>

<br>

Subtotal : Rp ${rupiah(sub)}

</div>
`;

});

let totalBayar=total+ongkir;

list.innerHTML+=`

<div class="card">

<b>Total Barang : Rp ${rupiah(total)}</b><br>

<b>Ongkir : Rp ${rupiah(ongkir)}</b>

<hr>

<b style="color:#008b4c;font-size:18px">

TOTAL BAYAR : Rp ${rupiah(totalBayar)}

</b>

</div>
`;

}

/* ================= CART CONTROL ================= */

function tambah(i){
cart[i].qty++;
simpan();
}

function kurang(i){
cart[i].qty--;
if(cart[i].qty<=0) cart.splice(i,1);
simpan();
}

function hapus(i){
cart.splice(i,1);
simpan();
}

function simpan(){
  localStorage.setItem("cart",JSON.stringify(cart));
  // Tetap simpan format yang dipahami index, supaya kedua halaman sinkron.
  localStorage.setItem("tsa_cart",JSON.stringify(cart.map(p=>({
    id:p.id,name:p.nama,price:p.harga,qty:p.qty
  }))));
  renderCart();
}

function kosongkan(){
  localStorage.removeItem("cart");
  localStorage.removeItem("tsa_cart");
  location.reload();
}

/* ================= CHECKOUT ================= */
function lanjutBayar(){
if(cart.length == 0){
popup("Keranjang masih kosong");
return;
}
let totalBarang = 0;

cart.forEach(p=>{
totalBarang += p.harga * p.qty;
});

if(minimalBelanja > 0 && totalBarang < minimalBelanja){

popup(
"Minimal belanja Rp " + rupiah(minimalBelanja) +
"<br>Tambah belanja Rp " +
rupiah(minimalBelanja-totalBarang) + " lagi"
);

return;

}

let manual = document.getElementById("manualLokasi").value.trim();

if((tujuanLat===null || tujuanLng===null) && !manual){
popup("Gunakan lokasi GPS atau isi alamat lengkap secara manual");
return;
}

let namaPembeli = document.getElementById("namaPembeli").value.trim();
let noWa = document.getElementById("waPembeli").value.trim();

if(!namaPembeli){
popup("Isi nama pembeli dulu");
return;
}

if(!noWa){
popup("Isi nomor WhatsApp dulu");
return;
}

localStorage.setItem("checkoutData", JSON.stringify({
lat: tujuanLat,
lng: tujuanLng,
alamatManual: manual,
desa: namaDesa,
kecamatan: namaKecamatan,
ongkir: ongkir,
minimalBelanja: minimalBelanja,
noWa: noWa,
namaPembeli: namaPembeli
}));

window.location.href = "checkout.html";

}

/* ================= LOKASI TANPA TAMPILAN PETA ================= */
// GPS, pencarian alamat, jarak, ongkir, dan estimasi tetap berfungsi.
// Jarak dihitung dengan rumus Haversine karena peta visual dihilangkan.
function jarakKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const rad = derajat => derajat * Math.PI / 180;
  const dLat = rad(lat2-lat1);
  const dLon = rad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 +
    Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function gunakanLokasi(){
  if(!navigator.geolocation){
    document.getElementById("manualLokasi").style.display="block";
    popup("HP tidak mendukung GPS. Silakan isi alamat lengkap.");
    return;
  }
  popup("📡 Sedang mencari lokasi Anda...");
  navigator.geolocation.getCurrentPosition(
    function(pos){
      const lat=pos.coords.latitude;
      const lng=pos.coords.longitude;
      const akurasi=pos.coords.accuracy;
      const box=document.getElementById("popupBox");
      if(box) box.remove();
      setLokasi(lat,lng);
      if(akurasi>100){
        document.getElementById("manualLokasi").style.display="block";
        popup("⚠️ Lokasi kurang akurat ("+Math.round(akurasi)+" meter). Periksa alamat Anda atau isi alamat manual.");
      }
    },
    function(){
      const box=document.getElementById("popupBox");
      if(box) box.remove();
      document.getElementById("manualLokasi").style.display="block";
      popup("❌ Lokasi GPS tidak ditemukan. Aktifkan GPS atau isi alamat lengkap secara manual.");
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function setLokasi(lat,lng){
  tujuanLat=lat;
  tujuanLng=lng;
  document.getElementById("infoZona").innerHTML="Lokasi ditemukan. Sedang menghitung jarak dan ongkir...";
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
    .then(res=>res.json())
    .then(data=>{
      const a=data.address||{};
      namaDesa=a.village||a.hamlet||a.suburb||a.neighbourhood||"-";
      namaKecamatan=a.subdistrict||a.city_district||a.town||a.county||"-";
      hitungOngkir();
    })
    .catch(()=>{
      namaDesa="-";
      namaKecamatan="-";
      hitungOngkir();
    });
}

function hitungOngkir(){
  if(tujuanLat===null || tujuanLng===null) return;
  jarakFix=jarakKm(tokoLat,tokoLng,tujuanLat,tujuanLng);

  if(jarakFix<=10){ongkir=5000;minimalBelanja=150000;}
  else if(jarakFix<=20){ongkir=10000;minimalBelanja=200000;}
  else if(jarakFix<=30){ongkir=15000;minimalBelanja=300000;}
  else{ongkir=20000;minimalBelanja=400000;}

  const totalBarang=cart.reduce((sum,p)=>sum+(p.harga*p.qty),0);
  const kurang=minimalBelanja-totalBarang;
  const infoTambah=totalBarang<minimalBelanja
    ? "<br><b style='color:#b42318'>Tambah belanja Rp "+rupiah(kurang)+" lagi</b>"
    : "";
  const estimasi=Math.ceil(jarakFix*3);
  document.getElementById("infoZona").innerHTML=
    "Jarak : "+jarakFix.toFixed(1)+" km<br>"+
    "Ongkir : Rp "+rupiah(ongkir)+"<br>"+
    "Minimal Belanja : Rp "+rupiah(minimalBelanja)+infoTambah+
    "<br>Estimasi Antar : ±"+estimasi+" menit<br>"+
    "Desa : "+namaDesa+"<br>"+
    "Kecamatan : "+namaKecamatan;
  renderCart();
}

/* ================= POPUP ================= */

function popup(pesan){

let box=document.createElement("div");
box.id="popupBox";

box.style.position="fixed";
box.style.top="0";
box.style.left="0";
box.style.width="100%";
box.style.height="100%";
box.style.background="rgba(0,0,0,0.5)";
box.style.display="flex";
box.style.alignItems="center";
box.style.justifyContent="center";
box.style.zIndex="9999";

box.innerHTML=

`<div style="background:white;padding:20px;border-radius:12px;width:80%;max-width:300px;text-align:center">

<h3 style="color:#008b4c;margin-top:0">
TOKO SIAP ANTAR
</h3>

<p>${pesan}</p>

<button onclick="this.parentElement.parentElement.remove()"
style="background:linear-gradient(100deg,#00a85a,#00c8d7);color:white;border:none;padding:10px 20px;border-radius:6px">
OK
</button>

</div>`;

document.body.appendChild(box);

}

renderCart();

window.addEventListener("load",function(){
  if(cart.length) updateCartStorageSafe();
  // Mencoba mengambil lokasi otomatis; pembeli tetap bisa mengisi alamat manual.
  gunakanLokasi();
});

function updateCartStorageSafe(){
  localStorage.setItem("cart",JSON.stringify(cart));
  localStorage.setItem("tsa_cart",JSON.stringify(cart.map(p=>({
    id:p.id,name:p.nama,price:p.harga,qty:p.qty
  }))));
}
</script>

</body>
</html>

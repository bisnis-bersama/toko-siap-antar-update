<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · CHECKOUT</strong><nav><a href="index.html">Toko</a><a href="keranjang.html">Keranjang</a><a href="akun.html">Akun</a></nav></header>
<main class="shell"><section class="panel"><h1>Checkout pesanan</h1><p class="muted">Kerangka checkout Firestore. Pastikan format keranjang di localStorage sama dengan struktur yang dipakai katalog.</p><div id="notice" class="notice" hidden></div><div id="cartSummary"></div>
<form id="checkoutForm"><label>Nama penerima</label><input name="nama" required><label>Nomor WhatsApp</label><input name="noWA" type="tel" required><label>Alamat pengiriman</label><textarea name="alamat" required></textarea><label>Catatan (opsional)</label><textarea name="catatan"></textarea><label>Metode pembayaran</label><select name="metodePembayaran"><option value="cod">Bayar saat diterima (COD)</option><option value="transfer">Transfer bank</option></select><div class="actions"><button type="submit">Buat pesanan</button><a class="btn light" href="keranjang.html">Kembali ke keranjang</a></div></form></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import {addDoc,collection,doc,getDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {money,notice,esc} from "./common.js";
const form=document.querySelector("#checkoutForm");let user=null;let items=[];
try{items=JSON.parse(localStorage.getItem("cart")||"[]");}catch{}
document.querySelector("#cartSummary").innerHTML=items.length?`<ul>${items.map(x=>`<li>${esc(x.nama||x.name||x.title||"Produk")} × ${Number(x.qty||x.quantity||1)} — ${money((x.harga||x.price||0)*(x.qty||x.quantity||1))}</li>`).join("")}</ul>`:"<p>Keranjang kosong atau format data belum cocok. Periksa integrasi dengan keranjang.html.</p>";
onAuthStateChanged(auth,async u=>{if(!u){notice("Silakan login sebelum checkout.","error");form.querySelector("button").disabled=true;return;}user=u;const s=await getDoc(doc(db,"users",u.uid));if(s.exists()){const p=s.data();form.nama.value=p.nama||u.displayName||"";form.noWA.value=p.noWA||p.telepon||"";form.alamat.value=p.alamat||"";}});
form.addEventListener("submit",async e=>{e.preventDefault();if(!user)return notice("Login terlebih dahulu.","error");if(!items.length)return notice("Keranjang kosong atau belum terbaca. Cocokkan format cart di keranjang.html.","error");const f=new FormData(form);const cleanItems=items.map(x=>({productId:String(x.id||x.productId||""),nama:String(x.nama||x.name||x.title||"Produk"),qty:Number(x.qty||x.quantity||1),harga:Number(x.harga||x.price||0)}));if(cleanItems.some(x=>!Number.isFinite(x.qty)||x.qty<1||!Number.isFinite(x.harga)||x.harga<0))return notice("Data item keranjang tidak valid.","error");const subtotal=cleanItems.reduce((a,x)=>a+x.qty*x.harga,0);try{const ref=await addDoc(collection(db,"orders"),{uid:user.uid,nama:f.get("nama"),noWA:f.get("noWA"),telepon:f.get("noWA"),alamat:f.get("alamat"),catatan:f.get("catatan"),items:cleanItems,subtotal,ongkir:0,total:subtotal,metodePembayaran:f.get("metodePembayaran"),status:"menunggu",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});localStorage.removeItem("cart");notice("Pesanan berhasil dibuat: "+ref.id,"success");form.reset();setTimeout(()=>location.href="riwayat.html",900);}catch(err){notice("Gagal membuat pesanan: "+err.message,"error");}});
</script></body></html>

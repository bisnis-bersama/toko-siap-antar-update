<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Wallet | Toko Siap Antar</title>
<style>
:root{--green:#00a86b;--green2:#008b5a;--yellow:#ffcc00;--ink:#173b32;--muted:#64756f;--bg:#f1f2f4;--line:#e6e7e8;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#171717;font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
.top{background:#111;color:#fff;padding:18px 16px 38px;border-radius:0 0 34px 34px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:900px;margin:auto}
.brand{font-weight:850;font-size:19px;letter-spacing:.2px;color:#ffd400}.sub{color:#d1d5db;font-size:13px;margin-top:3px}
.logout{background:#292929;border:1px solid #444;color:white;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}
main{max-width:760px;margin:0 auto 100px;padding:0 14px;position:relative}
.panel{background:#fff;border:0;border-radius:24px;padding:17px;margin-bottom:14px;box-shadow:0 8px 24px #0000000a}
.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.4px}.title{font-size:clamp(24px,6vw,32px);line-height:1.15;margin:7px 0 12px;font-weight:850;letter-spacing:-.6px}
.muted{color:var(--muted)}
.wallet{background:#fff;color:#171717;border:1px solid #ececec;border-radius:22px;padding:17px;position:relative;overflow:hidden}
.wallet-label{font-size:13px;color:#727b86;font-weight:700}.balance{font-size:30px;font-weight:850;margin:5px 0 12px;letter-spacing:.2px;color:#171717}
.wallet-row{border-top:1px solid #e5e5e5;padding-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wallet-stat{min-width:0;border:1px solid #e8e9e9;border-radius:15px;background:#f7f8f8;padding:13px 12px;display:flex;flex-direction:column;justify-content:center}
.wallet-stat span{font-size:12px;color:#727b86;font-weight:700}
.wallet-stat strong{font-size:clamp(16px,4.2vw,22px);line-height:1.25;margin-top:5px;color:#173b32;overflow-wrap:anywhere}
.wallet-action{background:#ffc800;color:#171717;border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}
.wallet-action.alt{background:#e5f8f0;color:#008b5a;border:1px solid #bdebd8}
.notice{background:#fff8d8;border:1px solid #f4df80;border-radius:12px;padding:11px 13px;font-size:13px;color:#5c4b00;margin-top:12px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}
.section-title h2{font-size:18px;margin:0}.section-title span{font-size:12px;color:var(--muted);font-weight:700}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 2px}
.menu{min-height:94px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;text-decoration:none;color:inherit;background:transparent;border:0}
.menu-icon{width:56px;height:56px;border-radius:17px;background:#111;color:#ffd400;display:grid;place-items:center;font-size:25px}
.menu b{font-size:12px;line-height:1.2;font-weight:700}.menu small{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:3px solid #ffd400;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:5}
.bottom a{color:#ffd400;text-decoration:none;text-align:center;font-size:11px;font-weight:750;min-width:54px}.bottom .ico{display:block;font-size:22px;margin-bottom:2px}
.hidden{display:none!important}.err{color:#b42318;font-size:13px;margin-top:10px;overflow-wrap:anywhere}
label{display:block;font-size:14px;font-weight:750;margin:12px 0 5px}input{width:100%;border:1px solid #cbd1d6;border-radius:12px;padding:12px;background:white}
.submit{margin-top:14px;width:100%;background:var(--yellow);border:0;border-radius:12px;padding:13px;font-weight:850;cursor:pointer}
@media(max-width:380px){.wallet-row{gap:7px}.wallet-stat{padding:10px 8px}.wallet-stat span{font-size:11px}.wallet-stat strong{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="topline">
 <div><div class="brand">🛵 TOKO SIAP ANTAR</div><div class="sub">E-Wallet & Pusat Aktivitas</div></div>
 <button id="logoutBtn" class="logout hidden" type="button">Keluar</button>
</div></header>
<main>
 <section id="loginPanel" class="panel">
  <div class="eyebrow">AKSES AKUN</div><h1 class="title">Masuk E-Wallet</h1>
  <form id="loginForm">
   <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
   <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
   <button class="submit" type="submit">Masuk</button>
  </form><div id="loginMsg" class="err" aria-live="polite"></div>
 </section>
 <section id="dashboard" class="hidden">
  <div class="panel">
   <div class="eyebrow">DASHBOARD <span id="roleLabel">AKUN</span></div>
   <h1 class="title">Halo, <span id="userName">Pengguna</span></h1>
   <div class="wallet">
    <div class="wallet-label">Sisa Saldo</div>
    <div class="balance" id="balance">Rp 0</div>
    <div class="wallet-row">
     <div class="wallet-stat"><span>Total Pendapatan</span><strong id="totalIncome">Rp 0</strong></div>
     <div class="wallet-stat"><span>Sudah Dicairkan</span><strong id="totalWithdrawn">Rp 0</strong></div>
    </div>
   </div>
  </div>
  <div class="panel">
   <div class="section-title"><h2>Menu Utama</h2><span id="roleMenu">AKUN</span></div>
   <div class="menu-grid" id="menuGrid"></div>
  </div>
 </section>
</main>
<nav class="bottom hidden" id="bottomNav">
 <a href="#" data-menu="home"><span class="ico">⌂</span>Beranda</a>
 <a href="#" data-menu="wallet"><span class="ico">💳</span>E-Wallet</a>
 <a href="#" data-menu="orders"><span class="ico">📦</span>Pesanan</a>
 <a href="#" data-menu="bills"><span class="ico">🧾</span>Tagihan</a>
 <a href="#" data-menu="history"><span class="ico">↻</span>Riwayat</a>
</nav>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
let profile=null,currentRole="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah=v=>"Rp "+Number(v||0).toLocaleString("id-ID");
const menusByRole={
 pelanggan:[["📦","Data Pesanan","Lihat status pesanan","data-pesanan.html"],["🛍️","Belanja","Cari produk","index.html"],["🧾","Tagihan","Tagihan belanja","tagihan.html"],["↻","Riwayat","Riwayat transaksi","riwayat.html"],["💳","E-Wallet","Saldo dompet","ewallet.html"],["👤","Profil Akun","Pengaturan akun","profil.html"]],
 mitra_usaha:[["📦","Data Pesanan","Pesanan toko","mitra-usaha.html"],["🛍️","Belanja Stok","Pembelian stok","belanja-mitra.html"],["🧾","Tagihan","Tagihan mitra","tagihan-mitra.html"],["↻","Riwayat","Riwayat transaksi","riwayat-mitra.html"],["💰","Saldo & Penghasilan","Penghasilan usaha","mitra-dompet.html"],["↗","Pencairan Saldo","Pengajuan pencairan","pencairan-saya.html"],["💳","E-Wallet","Saldo dompet","ewallet.html"],["👤","Profil Akun","Pengaturan akun","profil.html"]],
 kurir:[["📦","Data Pesanan","Pesanan tersedia","dashboard-mitra-pengantaran-pencarian-status.html"],["🛍️","Belanja","Kebutuhan","index.html"],["🧾","Tagihan","Tagihan kurir","tagihan-kurir.html"],["↻","Riwayat","Riwayat pengantaran","riwayat-kurir.html"],["💰","Penghasilan Kurir","Penghasilan antar","penghasilan-kurir.html"],["↗","Pencairan Saldo","Pengajuan pencairan","pencairan-saya.html"],["💳","E-Wallet","Saldo dompet","ewallet.html"],["👤","Profil Akun","Pengaturan akun","profil.html"]],
 admin:[["📦","Data Pesanan","Pantau pesanan","admin.html"],["🛍️","Belanja / Produk","Kelola katalog","produk-admin.html"],["🧾","Tagihan","Keuangan sistem","admin-keuangan.html"],["↻","Riwayat","Aktivitas sistem","riwayat-admin.html"],["👥","Data Pengguna","Pengguna","pengguna.html"],["✓","Approval","Persetujuan","admin-approval-pending.html"],["💳","E-Wallet","Saldo dompet","admin-ewallet.html"],["💸","Permintaan Pencairan","Pencairan mitra/kurir","admin-pencairan.html"],["👤","Profil Akun","Pengaturan akun","profil.html"]]
};
const roleNames={pelanggan:"Pelanggan",mitra_usaha:"Mitra Usaha",kurir:"Kurir",admin:"Admin"};
function renderDashboard(user,p){
 profile=p||{};currentRole=profile.role||"";
 if(!menusByRole[currentRole])throw Error("Role akun belum didukung: "+(currentRole||"kosong"));
 const status=String(profile.status??"").trim().toLowerCase();
 if(currentRole!=="admin"&&status&&!["aktif","active"].includes(status))throw Error("Akun belum aktif. Silakan hubungi admin.");
 $("loginPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");$("bottomNav").classList.remove("hidden");
 $("roleLabel").textContent=roleNames[currentRole].toUpperCase();
 $("userName").textContent=profile.nama||profile.namaUsaha||profile.name||profile.email||user.email||roleNames[currentRole];
 $("roleMenu").textContent=roleNames[currentRole].toUpperCase();
 const bal=profile.saldoEwallet??profile.saldoWallet??profile.saldo??profile.walletBalance??0;
 $("balance").textContent=rupiah(bal);
 const income=profile.totalPendapatan??profile.totalPenghasilan??profile.pendapatanTotal??profile.penghasilanTotal??0;
 const withdrawn=profile.totalDicairkan??profile.totalPenarikanBerhasil??profile.penghasilanDicairkan??0;
 $("totalIncome").textContent=rupiah(income);$("totalWithdrawn").textContent=rupiah(withdrawn);
 $("menuGrid").innerHTML=menusByRole[currentRole].map(m=>`<a class="menu" href="${esc(m[3])}"><span class="menu-icon">${m[0]}</span><b>${esc(m[1])}</b><small>${esc(m[2])}</small></a>`).join("");
}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").textContent="Memeriksa akun…";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent="";}catch(err){$("loginMsg").textContent="Login gagal: "+err.message;}});
$("logoutBtn").onclick=()=>signOut(auth);
$("bottomNav").addEventListener("click",e=>{const a=e.target.closest("a[data-menu]");if(!a)return;e.preventDefault();const key=a.dataset.menu;const map={orders:menusByRole[currentRole]?.find(m=>m[1]==="Data Pesanan")?.[3],bills:menusByRole[currentRole]?.find(m=>m[1]==="Tagihan")?.[3],history:menusByRole[currentRole]?.find(m=>m[1]==="Riwayat")?.[3]};if(key==="home"||key==="wallet")window.scrollTo({top:0,behavior:"smooth"});else if(map[key])location.href=map[key];});
onAuthStateChanged(auth,async user=>{if(!user){$("loginPanel").classList.remove("hidden");$("dashboard").classList.add("hidden");$("logoutBtn").classList.add("hidden");$("bottomNav").classList.add("hidden");return;}try{const snap=await getDoc(doc(db,"users",user.uid));if(!snap.exists())throw Error("Profil pengguna tidak ditemukan di users.");renderDashboard(user,snap.data());}catch(err){$("loginPanel").classList.remove("hidden");$("dashboard").classList.add("hidden");$("loginMsg").textContent=err.message;await signOut(auth);}});
</script>
</body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Pengguna | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · PENGGUNA</strong><nav><a href="admin.html">Pesanan</a><a href="produk-admin.html">Produk</a><a href="index.html">Toko</a><button id="logoutBtn" class="dark">Keluar</button></nav></header><main class="shell"><section class="panel"><h1>Data Pengguna Aktif</h1><p class="muted">Halaman ini hanya menampilkan pengguna yang sudah aktif. Persetujuan pendaftaran dilakukan di halaman Approval Pending.</p><div id="notice" class="notice" hidden></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Nomor WhatsApp</th><th>Role</th><th>Status</th></tr></thead><tbody id="users"><tr><td colspan="5">Memuat pengguna aktif…</td></tr></tbody></table></div></section></main>
<script type="module">
import {db} from "./firebase-config.js";
import {collection,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import {requireRole,esc,notice} from "./common.js";

requireRole(["admin"], async () => {
  const tb = document.querySelector("#users");
  try {
    const snap = await getDocs(collection(db, "users"));
    const activeUsers = snap.docs.filter(d => {
      const u = d.data() || {};
      return u.status === "aktif" && u.aktif !== false;
    });
    if (!activeUsers.length) {
      tb.innerHTML = '<tr><td colspan="5">Belum ada pengguna aktif.</td></tr>';
      return;
    }
    tb.innerHTML = activeUsers.map(d => {
      const u = d.data() || {};
      const phone = String(u.nomorWhatsApp || u.noWhatsApp || u.whatsapp || u.nomorHP || u.noHP || u.telepon || u.phone || "").replace(/\D/g, "");
      const wa = phone ? (phone.startsWith("0") ? "62" + phone.slice(1) : phone.startsWith("62") ? phone : "62" + phone) : "";
      const waButton = wa
        ? `<a class="btn" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener noreferrer">Chat WhatsApp</a>`
        : '<span class="muted">Nomor belum tersedia</span>';
      return `<tr>
        <td>${esc(u.nama || u.name || "-")}</td>
        <td>${esc(u.email || "-")}</td>
        <td>${waButton}</td>
        <td>${esc(u.role || "-")}</td>
        <td>Aktif</td>
      </tr>`;
    }).join("");
  } catch (e) {
    console.error("Gagal memuat pengguna aktif:", e);
    tb.innerHTML = `<tr><td colspan="5">Gagal memuat data: ${esc(e?.message || e)}</td></tr>`;
    notice("Gagal memuat pengguna aktif: " + (e?.message || e), "error");
  }
});
</script></body></html>

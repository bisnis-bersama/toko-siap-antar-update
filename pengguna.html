<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Pengguna | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · PENGGUNA</strong><nav><a href="admin.html">Pesanan</a><a href="produk-admin.html">Produk</a><a href="index.html">Toko</a><button id="logoutBtn" class="dark">Keluar</button></nav></header><main class="shell"><section class="panel"><h1>Kelola pengguna & role</h1><p class="muted">Admin dapat mengelola role pengguna. Role resmi hanya admin, pelanggan, mitra_usaha, dan kurir.</p><div id="notice" class="notice" hidden></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Role saat ini</th><th>Ubah role</th><th>Aksi</th></tr></thead><tbody id="users"><tr><td colspan="5">Memuat…</td></tr></tbody></table></div></section></main>
<script type="module">
import {db} from "./firebase-config.js";import {collection,getDocs,doc,updateDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {requireRole,esc,notice} from "./common.js";
const roles=["pelanggan","mitra_usaha","kurir","admin"];
requireRole(["admin"],async(_,profile)=>{const s=await getDocs(collection(db,"users"));const tb=document.querySelector("#users");if(s.empty){tb.innerHTML='<tr><td colspan="5">Belum ada pengguna.</td></tr>';return;}tb.innerHTML=s.docs.map(d=>{const u=d.data();return `<tr><td>${esc(u.nama||"-")}</td><td>${esc(u.email||"-")}</td><td>${esc(u.role||"-")}</td><td><select data-role="${esc(d.id)}" >${roles.map(r=>`<option ${r===u.role?"selected":""}>${r}</option>`).join("")}</select></td><td><button data-save="${esc(d.id)}" >Simpan</button></td></tr>`}).join("");tb.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const id=b.dataset.save;const role=tb.querySelector(`[data-role="${id}"]`).value;if(!confirm("Ubah role akun ini menjadi "+role+"?"))return;try{await updateDoc(doc(db,"users",id),{role});notice("Role diperbarui.","success");location.reload();}catch(e){notice("Gagal mengubah role: "+e.message,"error");}});});
</script></body></html>

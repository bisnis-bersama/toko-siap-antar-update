<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akun Saya | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · AKUN</strong><nav><a href="index.html">Toko</a><a href="checkout.html">Checkout</a><a href="lacak.html">Lacak pesanan</a><button id="logoutBtn" class="dark">Keluar</button></nav></header><main class="shell"><section class="panel"><h1>Akun saya</h1><p id="sessionLabel" class="muted">Memuat akun…</p><div id="notice" class="notice" hidden></div><div id="profile"></div><div class="actions"><a class="btn" href="riwayat.html">Pesanan & riwayat</a><a class="btn light" href="index.html">Belanja lagi</a></div></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {esc,setupNav,notice} from "./common.js";
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return;}try{const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()){notice("Profil tidak ditemukan di Firestore.","error");return;}const p=s.data();document.querySelector("#profile").innerHTML=`<p><b>Nama:</b> ${esc(p.nama)}</p><p><b>Email:</b> ${esc(p.email||u.email)}</p><p><b>WhatsApp:</b> ${esc(p.noWA||p.telepon)}</p><p><b>Alamat:</b> ${esc(p.alamat)}</p><p><b>Role:</b> ${esc(p.role)}</p>`;}catch(e){notice(e.message,"error");}});
</script></body></html>

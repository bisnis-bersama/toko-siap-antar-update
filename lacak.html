<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lacak Pesanan | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · PELACAKAN</strong><nav><a href="index.html">Toko</a><a href="login.html">Login</a></nav></header><main class="shell"><section class="panel"><h1>Lacak pesanan</h1><p class="muted">Masukkan kode pelacakan yang diberikan toko. Halaman publik hanya membaca data aman dari koleksi tracking.</p><div id="notice" class="notice" hidden></div><form id="trackForm"><label>Kode pelacakan</label><input id="trackingCode" required placeholder="Masukkan kode pelacakan"><div class="actions"><button>Lacak sekarang</button></div></form><div id="result"></div></section></main>
<script type="module">
import {db} from "./firebase-config.js";import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {esc,notice} from "./common.js";
const code=document.querySelector("#trackingCode"),result=document.querySelector("#result");const urlCode=new URLSearchParams(location.search).get("code");if(urlCode)code.value=urlCode;
document.querySelector("#trackForm").addEventListener("submit",async e=>{e.preventDefault();result.innerHTML="";try{const s=await getDoc(doc(db,"tracking",code.value.trim()));if(!s.exists()){notice("Data pelacakan belum tersedia. Hubungi toko jika pesanan sudah disetujui.","error");return;}const x=s.data();const history=Array.isArray(x.riwayatStatus)?x.riwayatStatus:[];result.innerHTML=`<section class="panel"><h2>Status saat ini: <span class="badge ${esc(x.status)}">${esc(x.status||"belum tersedia")}</span></h2><p>Invoice: ${esc(x.invoice||code.value)}</p><p>Pembaruan: ${esc(x.updatedAt?.toDate?.().toLocaleString("id-ID")||"-")}</p><h2>Riwayat status</h2>${history.length?`<ol>${history.map(h=>`<li><b>${esc(h.status)}</b> — ${esc(h.waktu?.toDate?.().toLocaleString("id-ID")||h.waktu||"")}</li>`).join("")}</ol>`:"<p>Riwayat belum tersedia.</p>"}</section>`;}catch(err){notice("Gagal melacak pesanan: "+err.message,"error");}});
</script></body></html>

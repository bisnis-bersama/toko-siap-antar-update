<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR</strong><nav><a href="index.html">Toko</a><a href="login.html">Login</a></nav></header>
<main class="shell"><section class="panel" style="max-width:620px;margin:auto"><h1>Daftar pelanggan</h1><p class="muted">Role dibuat otomatis sebagai pelanggan. Hak admin/mitra hanya diberikan oleh superadmin.</p><div id="notice" class="notice" hidden></div>
<form id="registerForm"><label>Nama lengkap</label><input name="nama" required maxlength="100"><label>Alamat</label><textarea name="alamat" required></textarea><label>Nomor WhatsApp</label><input name="noWA" type="tel" required><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Password (minimal 6 karakter)</label><input name="password" type="password" minlength="6" required><label>Ulangi password</label><input name="confirm" type="password" minlength="6" required><div class="actions"><button type="submit">Daftar</button><a class="btn light" href="login.html">Sudah punya akun</a></div></form></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {createUserWithEmailAndPassword,updateProfile} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import {notice} from "./common.js";
document.querySelector("#registerForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get("password")!==f.get("confirm"))return notice("Password dan ulangi password tidak sama.","error");try{const cred=await createUserWithEmailAndPassword(auth,f.get("email"),f.get("password"));await updateProfile(cred.user,{displayName:f.get("nama")});await setDoc(doc(db,"users",cred.user.uid),{uid:cred.user.uid,nama:f.get("nama"),alamat:f.get("alamat"),noWA:f.get("noWA"),telepon:f.get("noWA"),email:f.get("email"),role:"pelanggan",createdAt:serverTimestamp()});notice("Pendaftaran berhasil. Mengalihkan ke akun…","success");setTimeout(()=>location.href="akun.html",700);}catch(err){notice("Pendaftaran gagal: "+err.message,"error");}});
</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · ADMIN</strong><nav><a href="admin.html">Pesanan</a><a href="produk-admin.html">Produk</a><a href="pengguna.html">Pengguna</a><a href="admin-approval-pending.html">Approval Pending</a><a href="admin-keuangan.html">Keuangan</a><a href="mitra-usaha.html">Mitra Usaha</a><a href="daftar-mitra-usaha.html">Daftar Mitra Usaha</a><a href="index.html">Toko</a><button id="logoutBtn" class="dark">Keluar</button></nav></header>
<main class="shell"><section class="panel"><h1>Dashboard pesanan</h1><p id="sessionLabel" class="muted">Memuat akun…</p><div id="notice" class="notice" hidden></div><div class="grid"><div class="stat">Menunggu<b id="n-menunggu">—</b></div><div class="stat">Dikemas<b id="n-dikemas">—</b></div><div class="stat">Dikirim<b id="n-dikirim">—</b></div><div class="stat">Selesai<b id="n-selesai">—</b></div></div></section>
<section class="panel"><h2>Semua pesanan</h2><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Pelanggan</th><th>Total</th><th>Status</th><th>Ubah status</th><th>Tugaskan mitra</th><th>Aksi</th></tr></thead><tbody id="orders"><tr><td colspan="7">Memuat…</td></tr></tbody></table></div></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";import {collection,getDocs,doc,updateDoc,deleteDoc,setDoc,serverTimestamp,query,orderBy,where} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {requireRole,money,esc,notice} from "./common.js";
const statuses=["menunggu","disetujui","dikemas","dikirim","selesai","dibatalkan"];
let mitras=[];
requireRole(["admin"],async()=>{await loadMitras();await load();});
async function loadMitras(){
  try {
    const snap=await getDocs(query(collection(db,"users"),where("role","==","mitra_usaha")));
    mitras=snap.docs.map(d=>({uid:d.id,data:d.data()}));
  } catch(e) { mitras=[]; notice("Daftar mitra tidak bisa dimuat: "+e.message,"error"); }
}
async function assignMitra(orderId,mitraUid){
  try {
    await updateDoc(doc(db,"orders",orderId),{mitraUsahaUid:mitraUid||"",updatedAt:serverTimestamp()});
    notice(mitraUid?"Pesanan berhasil ditugaskan ke mitra usaha.":"Penugasan mitra dihapus.","success");
    await load();
  } catch(e) { notice("Gagal menugaskan mitra: "+e.message,"error"); }
}
async function load(){const tb=document.querySelector("#orders");try{const snap=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc")));const docs=snap.docs;for(const s of statuses){const el=document.querySelector("#n-"+s);if(el)el.textContent=docs.filter(d=>d.data().status===s).length;}if(!docs.length){tb.innerHTML='<tr><td colspan="7">Belum ada pesanan.</td></tr>';return;}tb.innerHTML=docs.map(d=>{const x=d.data();return `<tr><td>${esc(d.id)}</td><td>${esc(x.nama||x.uid||"-")}<br><small>${esc(x.noWA||x.telepon||"")}</small></td><td>${money(x.total)}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td><select data-status="${esc(d.id)}">${statuses.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select><button data-save="${esc(d.id)}">Simpan</button></td><td><select data-mitra="${esc(d.id)}"><option value="">-- Tanpa mitra --</option>${mitras.map(m=>`<option value="${esc(m.uid)}" ${x.mitraUsahaUid===m.uid?"selected":""}>${esc(m.data.nama||m.data.name||m.data.email||m.uid)}</option>`).join("")}</select><button data-assign="${esc(d.id)}">Tugaskan</button></td><td><button class="danger" data-delete="${esc(d.id)}">Hapus</button></td></tr>`}).join("");tb.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>changeStatus(b.dataset.save,tb.querySelector(`[data-status="${b.dataset.save}"]`).value));tb.querySelectorAll("[data-assign]").forEach(b=>b.onclick=()=>assignMitra(b.dataset.assign,tb.querySelector(`[data-mitra="${b.dataset.assign}"]`).value));tb.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removeOrder(b.dataset.delete));}catch(e){notice("Gagal memuat pesanan: "+e.message,"error");}}
async function changeStatus(id,status){try{const ref=doc(db,"orders",id);await updateDoc(ref,{status,updatedAt:serverTimestamp(),...(status==="disetujui"?{approvedAt:serverTimestamp()}:{}),...(status==="dikemas"?{packedAt:serverTimestamp()}:{}),...(status==="dikirim"?{shippedAt:serverTimestamp()}:{}),...(status==="selesai"?{completedAt:serverTimestamp()}:{})});const trk=doc(db,"tracking",id);const old=await (await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js")).getDoc(trk);const prev=old.exists()&&Array.isArray(old.data().riwayatStatus)?old.data().riwayatStatus:[];await setDoc(trk,{invoice:id,status,updatedAt:serverTimestamp(),riwayatStatus:[...prev,{status,waktu:new Date().toISOString()}]});notice("Status pesanan diperbarui.","success");await load();}catch(e){notice("Gagal mengubah status: "+e.message,"error");}}
async function removeOrder(id){if(!confirm("Hapus pesanan "+id+"? Tindakan ini tidak bisa dibatalkan."))return;try{await deleteDoc(doc(db,"orders",id));notice("Pesanan dihapus.","success");await load();}catch(e){notice("Gagal menghapus: "+e.message,"error");}}
</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Produk | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · PRODUK</strong><nav><a href="admin.html">Pesanan</a><a href="pengguna.html">Pengguna</a><a href="index.html">Toko</a><button id="logoutBtn" class="dark">Keluar</button></nav></header><main class="shell"><section class="panel"><h1>Tambah / edit produk</h1><div id="notice" class="notice" hidden></div><form id="productForm"><input type="hidden" name="id"><label>Nama produk</label><input name="nama" required><label>Kategori</label><input name="kategori" required><label>Harga (rupiah)</label><input name="harga" type="number" min="0" required><label>Stok</label><input name="stok" type="number" min="0" required><label>URL gambar (opsional)</label><input name="gambar" type="url"><label>Deskripsi</label><textarea name="deskripsi"></textarea><div class="actions"><button>Simpan produk</button><button type="button" class="light" id="resetBtn">Kosongkan</button></div></form></section><section class="panel"><h2>Daftar produk</h2><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="products"></tbody></table></div></section></main>
<script type="module">
import {db} from "./firebase-config.js";import {collection,addDoc,getDocs,doc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {requireRole,money,esc,notice,$} from "./common.js";
requireRole(["admin"],load);
async function load(){await refresh();}
async function refresh(){try{const s=await getDocs(collection(db,"products"));const tb=$("#products");tb.innerHTML=s.empty?'<tr><td colspan="5">Belum ada produk.</td></tr>':s.docs.map(d=>{const p=d.data();return `<tr><td>${esc(p.nama||p.name)}</td><td>${esc(p.kategori||"-")}</td><td>${money(p.harga||p.price)}</td><td>${esc(p.stok??0)}</td><td><button data-edit="${esc(d.id)}">Edit</button> <button class="danger" data-del="${esc(d.id)}">Hapus</button></td></tr>`}).join("");tb.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>fill(b.dataset.edit,s.docs.find(x=>x.id===b.dataset.edit).data()));tb.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Hapus produk?")){try{await deleteDoc(doc(db,"products",b.dataset.del));await refresh();}catch(e){notice(e.message,"error");}}});}catch(e){notice("Gagal memuat produk: "+e.message,"error");}}
function fill(id,p){const f=$("#productForm");f.id.value=id;f.nama.value=p.nama||p.name||"";f.kategori.value=p.kategori||"";f.harga.value=p.harga??p.price??0;f.stok.value=p.stok??0;f.gambar.value=p.gambar||p.image||"";f.deskripsi.value=p.deskripsi||"";window.scrollTo({top:0,behavior:"smooth"});}
$("#resetBtn").onclick=()=>$("#productForm").reset();
$("#productForm").onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const data={nama:f.nama.value.trim(),kategori:f.kategori.value.trim(),harga:Number(f.harga.value),stok:Number(f.stok.value),gambar:f.gambar.value.trim(),deskripsi:f.deskripsi.value.trim(),updatedAt:serverTimestamp()};try{if(f.id.value)await updateDoc(doc(db,"products",f.id.value),data);else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});f.reset();await refresh();notice("Produk disimpan.","success");}catch(err){notice("Gagal menyimpan produk: "+err.message,"error");}};
</script></body></html>

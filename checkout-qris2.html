<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · CHECKOUT</strong><nav><a href="index.html">Toko</a><a href="keranjang.html">Keranjang</a><a href="akun.html">Akun</a></nav></header>
<main class="shell"><section class="panel"><h1>Checkout pesanan</h1><p class="muted">Pesanan dikirim langsung ke sistem Toko Siap Antar dan disimpan di Firestore. Tidak dialihkan ke WhatsApp.</p><div id="notice" class="notice" hidden></div><div id="cartSummary"></div>
<form id="checkoutForm"><label>Nama penerima</label><input name="nama" required><label>Nomor WhatsApp</label><input name="noWA" type="tel" required><label>Alamat pengiriman</label><textarea name="alamat" required></textarea><label>Catatan (opsional)</label><textarea name="catatan"></textarea><label>Metode pembayaran</label><select name="metodePembayaran" id="metodePembayaran"><option value="cod">Bayar saat diterima (COD)</option><option value="transfer">Transfer bank / QRIS</option></select><div id="qrisPanel" class="panel" hidden style="margin-top:14px;padding:12px"><h3>Pembayaran QRIS</h3><p class="muted">Scan QRIS di bawah untuk membayar pesanan.</p><iframe src="qris2.html" title="QRIS Toko Siap Antar" loading="lazy" style="display:block;width:100%;min-height:520px;border:0;border-radius:10px;background:#fff"></iframe><p class="muted">Jika QRIS tidak tampil, <a href="qris2.html" target="_blank" rel="noopener">buka halaman QRIS</a>.</p></div><div class="actions"><button type="submit">Buat pesanan</button><a class="btn light" href="keranjang.html">Kembali ke keranjang</a></div></form></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import {addDoc,collection,doc,getDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {money,notice,esc} from "./common.js";
const form=document.querySelector("#checkoutForm");let user=null;let items=[];let checkoutData={};
const paymentSelect=document.querySelector("#metodePembayaran");
const qrisPanel=document.querySelector("#qrisPanel");
function updatePaymentPanel(){qrisPanel.hidden=paymentSelect.value!=="transfer";}
paymentSelect.addEventListener("change",updatePaymentPanel);
updatePaymentPanel();
try{items=JSON.parse(localStorage.getItem("cart")||"[]");}catch{}
try{checkoutData=JSON.parse(localStorage.getItem("checkoutData")||"{}");}catch{}
if(!items.length){try{items=JSON.parse(localStorage.getItem("tsa_cart")||"[]");}catch{}}
const parsePrice=v=>{if(typeof v==="number")return v;const n=Number(String(v??"").replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",","."));return Number.isFinite(n)?n:0;};
document.querySelector("#cartSummary").innerHTML=items.length?`<ul>${items.map(x=>`<li>${esc(x.nama||x.name||x.title||"Produk")} × ${Number(x.qty||x.quantity||1)} — ${money((x.harga||x.price||0)*(x.qty||x.quantity||1))}</li>`).join("")}</ul>`:"<p>Keranjang kosong atau format data belum cocok. Periksa integrasi dengan keranjang.html.</p>";
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html?next=checkout.html";return;}user=u;try{const s=await getDoc(doc(db,"users",u.uid));if(s.exists()){const p=s.data();form.nama.value=checkoutData.namaPembeli||p.nama||u.displayName||"";form.noWA.value=checkoutData.noWa||p.noWA||p.telepon||"";form.alamat.value=checkoutData.alamatManual||p.alamat||"";}}catch(err){notice("Akun berhasil dibaca sebagian. Lengkapi data penerima secara manual.","error");}const shipping=Math.max(0,parsePrice(checkoutData.ongkir||0));const total=items.reduce((a,x)=>a+parsePrice(x.harga??x.price)*(Number(x.qty??x.quantity??1)),0);if(items.length){document.querySelector("#cartSummary").innerHTML+=`<p>Ongkir: <b>${money(shipping)}</b></p><p>Total: <b>${money(total+shipping)}</b></p>`;}});
form.addEventListener("submit",async e=>{e.preventDefault();if(!user)return notice("Login terlebih dahulu.","error");if(!items.length)return notice("Keranjang kosong atau belum terbaca. Cocokkan format cart di keranjang.html.","error");const f=new FormData(form);const cleanItems=items.map(x=>({productId:String(x.id||x.productId||""),nama:String(x.nama||x.name||x.title||"Produk"),qty:Number(x.qty||x.quantity||1),harga:Number(x.harga||x.price||0)}));if(cleanItems.some(x=>!Number.isFinite(x.qty)||x.qty<1||!Number.isFinite(x.harga)||x.harga<0))return notice("Data item keranjang tidak valid.","error");const subtotal=cleanItems.reduce((a,x)=>a+x.qty*x.harga,0);const biayaKirim=Math.max(0,parsePrice(checkoutData.ongkir||0));const alamatForm=String(f.get("alamat")||"").trim();const alamatFinal=alamatForm||String(checkoutData.alamatManual||"").trim();if(!alamatFinal)return notice("Isi alamat pengiriman lengkap.","error");try{const ref=await addDoc(collection(db,"orders"),{uid:user.uid,nama:String(f.get("nama")||"").trim(),noWA:String(f.get("noWA")||"").trim(),telepon:String(f.get("noWA")||"").trim(),alamat:alamatFinal,catatan:String(f.get("catatan")||""),items:cleanItems,subtotal,ongkir:biayaKirim,total:subtotal+biayaKirim,desa:checkoutData.desa||"",kecamatan:checkoutData.kecamatan||"",lokasi:{lat:checkoutData.lat??null,lng:checkoutData.lng??null},metodePembayaran:f.get("metodePembayaran"),status:"menunggu",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});localStorage.removeItem("cart");localStorage.removeItem("tsa_cart");localStorage.removeItem("checkoutData");notice("Pesanan berhasil dibuat dan tersimpan. Nomor pesanan: "+ref.id,"success");form.reset();setTimeout(()=>location.href="riwayat.html",1200);}catch(err){notice("Gagal membuat pesanan: "+err.message,"error");}});
</script></body></html>

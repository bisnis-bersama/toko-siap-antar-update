<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan Saya | Toko Siap Antar</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>TOKO SIAP ANTAR · PESANAN SAYA</strong><nav><a href="index.html">Toko</a><a href="akun.html">Akun</a><a href="lacak.html">Lacak pesanan</a><button id="logoutBtn" class="dark">Keluar</button></nav></header><main class="shell"><section class="panel"><h1>Pesanan & riwayat</h1><div id="notice" class="notice" hidden></div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Tanggal</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="orders"><tr><td colspan="5">Memuat pesanan…</td></tr></tbody></table></div></section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import {collection,query,where,getDocs,orderBy} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import {money,esc,notice} from "./common.js";
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return;}const tb=document.querySelector("#orders");try{const q=query(collection(db,"orders"),where("uid","==",u.uid),orderBy("createdAt","desc"));const snap=await getDocs(q);if(snap.empty){tb.innerHTML='<tr><td colspan="5">Belum ada pesanan.</td></tr>';return;}tb.innerHTML=snap.docs.map(d=>{const x=d.data();const date=x.createdAt?.toDate?.().toLocaleString("id-ID")||"-";return `<tr><td>${esc(d.id)}</td><td>${esc(date)}</td><td>${money(x.total)}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td><a class="btn light" href="lacak.html?code=${encodeURIComponent(x.trackingCode||d.id)}">Lacak</a></td></tr>`}).join("");}catch(e){notice("Gagal memuat pesanan: "+e.message,"error");tb.innerHTML='<tr><td colspan="5">Tidak dapat memuat pesanan. Periksa Rules dan indeks Firestore.</td></tr>';}})
</script></body></html>

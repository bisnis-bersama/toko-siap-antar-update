<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00a85a"><title>Data Pesanan | Toko Siap Antar</title><style>:root{--g:#00a85a;--c:#00c8a0;--y:#ffd400;--ink:#18312b;--muted:#66756f;--line:#dceee5}*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:var(--ink);font:15px Arial,sans-serif;padding-bottom:82px}header{background:#fff;border-bottom:2px solid var(--y);padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0000000b}header img{width:48px;height:44px;object-fit:contain}header strong{color:#008b4c;font-size:17px}header small{display:block;color:var(--muted);font-size:12px;margin-top:3px}main{max-width:820px;margin:auto;padding:16px 12px}.title{margin:4px 0;font-size:23px}.sub{color:var(--muted);font-size:13px;margin:6px 0 16px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 7px #18312b08}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #edf4ef}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:12px}.price{font-weight:800;color:#008b4c}.btn{border:0;border-radius:10px;padding:12px 14px;background:linear-gradient(100deg,var(--g),var(--c));color:white;font-weight:700;cursor:pointer}.btn2{border:1px solid #b9e5ce;background:#effbf3;color:#087b45;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.danger{background:#fff0ed;color:#b42318;border:0;border-radius:9px;padding:8px 10px}.full{width:100%;margin-top:10px}input,textarea,select{display:block;width:100%;border:1px solid #cfe5d8;border-radius:10px;padding:12px;font:inherit;margin:6px 0 12px;background:#fff;color:var(--ink)}label{font-weight:700;font-size:13px}.note{padding:12px;border-radius:10px;background:#eef7ff;margin:10px 0;font-size:13px}.ok{background:#e5fff0;color:#087b45}.err{background:#fff0ed;color:#b42318}.empty{text-align:center;color:var(--muted);padding:28px 12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:9px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom a{text-decoration:none;color:#008b4c;font-size:19px;text-align:center;min-width:48px}.bottom small{display:block;font-size:10px;margin-top:3px}@media(max-width:480px){.title{font-size:20px}.card{padding:12px}header strong{font-size:15px}}</style></head><body><header><img src="logo3.png" alt="Logo Toko Siap Antar"><div><strong>Toko Siap Antar</strong><small>Belanja sparepart dan aksesori HP lebih mudah</small></div></header><main><h1 class="title">📦 Data Pesanan</h1><p class="sub">Pesanan aktif akun yang sedang login.</p><div id="msg"></div><div id="authNeed" class="card" hidden>Login untuk melihat pesanan. <button class="btn full" onclick="location.href='profil.html?next=pesanan.html'">Login / Daftar</button></div><div id="orders"></div></main><nav class="bottom"><a href="index.html">⌂<small>Beranda</small></a><a href="keranjang.html">🛒<small>Keranjang</small></a><a href="pesanan.html">▤<small>Pesanan</small></a><a href="riwayat.html">◷<small>Riwayat</small></a><a href="profil.html">👤<small>Profil</small></a></nav><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,getDocs,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",authDomain:"teknisi-ponsel-maja.firebaseapp.com",projectId:"teknisi-ponsel-maja",storageBucket:"teknisi-ponsel-maja.firebasestorage.app",messagingSenderId:"835618012205",appId:"1:835618012205:web:95e41095d1a56c761d4ca4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupiah=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
function parsePrice(v){if(typeof v==='number')return v;let s=String(v??'').replace(/Rp/gi,'').replace(/\s/g,'').replace(/[^0-9,.-]/g,'');if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(s.includes('.')&&(s.split('.').length>2||s.split('.')[1]?.length===3))s=s.replace(/\./g,'');else if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return Number.isFinite(n)?n:0;}
function note(id,msg,type='info'){const el=$(id);if(el)el.innerHTML=`<div class="note ${type}">${esc(msg)}</div>`}
function goLogin(){location.href='profil.html?next='+encodeURIComponent(location.pathname.split('/').pop()||'index.html')}
function cartRead(){try{return JSON.parse(localStorage.getItem('tsa_cart')||'[]').filter(x=>x&&x.name&&Number(x.qty)>0)}catch{return []}}
function nav(active=''){return `<nav class="bottom"><a href="index.html">⌂<small>Beranda</small></a><a href="keranjang.html">🛒<small>Keranjang</small></a><a href="pesanan.html">▤<small>Pesanan</small></a><a href="riwayat.html">◷<small>Riwayat</small></a><a href="profil.html">👤<small>Profil</small></a></nav>`}

let current=null;function dateText(v){try{return v?.toDate?v.toDate().toLocaleString('id-ID'):v?new Date(v).toLocaleString('id-ID'):'Waktu belum tersedia'}catch{return 'Waktu belum tersedia'}}onAuthStateChanged(auth,async u=>{current=u;if(!u){$('authNeed').hidden=false;return}try{const snap=await getDocs(query(collection(db,'orders'),where('ownerUid','==',u.uid)));let arr=snap.docs.map(d=>({id:d.id,...d.data()}));arr.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));arr=arr.filter(o=>!['SELESAI','DITOLAK','DIBATALKAN','CANCELLED','COMPLETED'].includes(String(o.status||'').toUpperCase()));render(arr)}catch(e){note('msg','Tidak dapat membaca pesanan. Periksa aturan Firestore untuk membaca orders milik akun sendiri. '+e.message,'err')}});function render(arr){const el=$('orders');if(!arr.length){el.innerHTML='<div class="card empty">Belum ada pesanan aktif.</div>';return}el.innerHTML=arr.map(o=>`<div class="card"><div class="row"><b>${esc(o.nomorPesanan||o.id)}</b><span class="muted">${esc(dateText(o.createdAt))}</span></div><div class="row"><span>Status</span><b>${esc(o.status||'MENUNGGU_PERSETUJUAN')}</b></div><div>${(o.items||[]).map(x=>`<div class="row"><span>${esc(x.nama||x.name)} × ${Number(x.qty)||1}</span><b>${rupiah(x.subtotal??(Number(x.harga)||0)*(Number(x.qty)||1))}</b></div>`).join('')}</div><div class="row"><b>Total</b><b class="price">${rupiah(o.total)}</b></div><div class="muted">Metode: ${esc(o.metodePembayaran||'-')}</div></div>`).join('')}</script></body></html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00a85a">
<title>Toko Siap Antar</title>
<style>
:root{--green:#00a85a;--cyan:#00c8d7;--yellow:#ffd400;--ink:#18312b;--muted:#66756f;--paper:#fffef0;--card:#fff;--line:#dceee5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding-bottom:82px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#009b4b,#00c9c9,#a9d900);padding:10px 14px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--yellow)}
.brand{display:flex;align-items:center;gap:8px;color:white;font-weight:800;text-shadow:0 1px 3px #246a40}
.brand img{display:block;width:64px;height:52px;object-fit:contain;flex:0 0 auto}
.head-actions{display:flex;gap:8px}
.head-actions button{border:1px solid #ffffff80;background:#ffffff20;color:#fff;border-radius:12px;padding:8px 11px;font-size:20px}
.promo{margin:8px 0 0;border-block:2px solid var(--yellow);background:linear-gradient(90deg,#00a85a,#00c8d7,#d8e500);padding:4px 0}
.promo-window{overflow:hidden;background:#fff;border-radius:10px;min-height:135px}
.promo-track{display:flex;width:max-content;animation:promoGeser 24s linear infinite;will-change:transform}
.promo-track:hover{animation-play-state:paused}
.promo-track img{display:block;flex:0 0 min(72vw,680px);width:min(72vw,680px);height:135px;object-fit:contain;background:#fff;margin-right:6px}
@keyframes promoGeser{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.promo-track{animation:none;overflow-x:auto;max-width:100%}}
.quick-wrap{position:sticky;top:58px;z-index:15;background:#fffef0;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.categories{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:2px 0 9px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:0;border-radius:30px;background:#edf5f0;padding:10px 14px;color:#34433d;font-size:14px}
.cat.active{background:linear-gradient(100deg,#00a85a,#00c8d7);color:white}
.cat.menu{background:var(--yellow);color:#222}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #a8dfc6;border-radius:30px;padding:0 14px;box-shadow:0 1px 5px #0000000a}
.search input{width:100%;border:0;outline:0;background:transparent;padding:13px 0;font-size:15px;color:#23352e}
main{padding:10px 12px 18px;min-height:150px}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.product{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 2px 5px #18312b12;display:flex;flex-direction:column}
.product-photo{height:112px;background:linear-gradient(135deg,#e4fff2,#fafff0);display:flex;align-items:center;justify-content:center;padding:6px}
.product-photo img{width:100%;height:100%;object-fit:contain}
.product-info{padding:8px 7px 9px;display:flex;flex-direction:column;flex:1;text-align:center;gap:6px}
.product-name{font-size:11px;line-height:1.35;min-height:29px;overflow-wrap:anywhere}
.product-desc{font-size:9px;line-height:1.35;color:var(--muted);min-height:25px}
.price{font-weight:800;color:#008b4c;font-size:12px}
.actions{display:grid;grid-template-columns:30px 30px minmax(0,1fr);gap:4px;margin-top:auto}
.actions button{border:0;border-radius:8px;min-height:29px;font-size:11px}
.wa{background:#e0fff0}.cart{background:#fff7ce}.buy{background:#ffc400;color:#171717;font-weight:700}
.notice{padding:20px 12px;text-align:center;color:#6b7770;background:#fff;border:1px solid var(--line);border-radius:12px}
footer{margin:18px 12px 0;padding:22px 12px;background:#fff;text-align:center}
footer h3{margin:0 0 16px;color:#009c54}
.socials{display:flex;justify-content:center;gap:28px}
.socials a{color:#222;text-decoration:none;font-size:13px}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px #0000000c}
.bottom-nav button{background:none;border:0;color:#777;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom-nav .ico{font-size:22px;line-height:1.2}
.bottom-nav button:first-child{color:#009c54}
@media(max-width:520px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product-photo{height:125px}.product-name{font-size:12px}.product-desc{font-size:10px}.price{font-size:13px}.quick-wrap{top:58px}.promo-track img{height:125px}}
@media(max-width:360px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.product-photo{height:105px}.cat{padding:9px 11px;font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="brand-logo-left" src="logo3.png" alt="Logo Toko Siap Antar"></div>
  <div class="head-actions"><button id="refresh" aria-label="Muat ulang">↻</button><button id="theme" aria-label="Ganti tema">☾</button></div>
</header>
<section class="promo" aria-label="Promo">
  <div class="promo-window"><div class="promo-track" id="promoTrack">
    <img src="silde1.png" alt="Promo 1"><img src="silde2.png" alt="Promo 2"><img src="silde3.png" alt="Promo 3"><img src="silde4.png" alt="Promo 4"><img src="silde5.png" alt="Promo 5"><img src="silde6.png" alt="Promo 6">
    <img src="silde1.png" alt="Promo 1" aria-hidden="true"><img src="silde2.png" alt="Promo 2" aria-hidden="true"><img src="silde3.png" alt="Promo 3" aria-hidden="true"><img src="silde4.png" alt="Promo 4" aria-hidden="true"><img src="silde5.png" alt="Promo 5" aria-hidden="true"><img src="silde6.png" alt="Promo 6" aria-hidden="true">
  </div></div>
</section>
<section class="quick-wrap">
  <nav class="categories" id="categories" aria-label="Kategori">
    <button class="cat menu" data-cat="__menu">☰ MENU</button>
    <button class="cat active" data-cat="Semua">🏠 Semua</button>
    <button class="cat" data-cat="LCD">📱 LCD</button>
    <button class="cat" data-cat="Baterai">🔋 Baterai</button>
    <button class="cat" data-cat="Flexible">🔌 Flexible</button>
    <button class="cat" data-cat="IC">🧩 IC</button>
    <button class="cat" data-cat="Charger">⚡ Charger</button>
    <button class="cat" data-cat="Kamera">📷 Kamera</button>
    <button class="cat" data-cat="Case">📱 Case</button>
  </nav>
  <label class="search"><span>🔎</span><input id="searchInput" type="search" placeholder="Cari produk, tipe HP, LCD, baterai..." autocomplete="off"></label>
</section>
<main><div id="products" class="products"><div class="notice" style="grid-column:1/-1">Memuat produk dari Google Sheets…</div></div></main>
<footer><h3>🌐 Ikuti Kami</h3><div class="socials"><a href="#" id="facebook">● Facebook</a><a href="#" id="instagram">◎ Instagram</a><a href="#" id="whatsapp">◉ WhatsApp</a></div></footer>
<nav class="bottom-nav" aria-label="Navigasi bawah">
  <button id="homeBtn"><span class="ico">⌂</span>Home</button><button id="historyBtn"><span class="ico">▤</span>Riwayat</button><button id="cartBtn"><span class="ico">🛒 <sup id="cartCount">0</sup></span>Keranjang</button><button id="profileBtn"><span class="ico">👤</span>Profil</button>
</nav>
<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1H23wsTKmR1grQgSAqULbUCM9wQdfx5u6RHJwrrbROG0/gviz/tq?sheet=MEMBER';
const productsEl = document.getElementById('products');
const searchInput = document.getElementById('searchInput');
let allProducts = [];
let activeCategory = 'Semua';
let cart = JSON.parse(localStorage.getItem('tsa_cart') || '[]');
const formatPrice = value => {
  const n = Number(String(value ?? '').replace(/[^\d,-]/g,'').replace(/\./g,'').replace(',','.'));
  return Number.isFinite(n) && n ? 'Rp ' + n.toLocaleString('id-ID') : (value ? String(value) : 'Hubungi kami');
};
function convertImage(url) {
  if (!url) return '';
  const s = String(url).trim();
  const id = s.match(/(?:id=|\/d\/)([A-Za-z0-9_-]{15,})/);
  if (id && /drive\.google\.com/.test(s)) return 'https://drive.google.com/thumbnail?id=' + id[1] + '&sz=w600';
  return s;
}
function renderProducts() {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = allProducts.filter(p => {
    const matchesText = !q || p.searchText.includes(q);
    const matchesCategory = activeCategory === 'Semua' || activeCategory === '__menu' ||
      (p.name + ' ' + p.description).toLowerCase().includes(activeCategory.toLowerCase());
    return matchesText && matchesCategory;
  });
  if (!filtered.length) {
    productsEl.innerHTML = '<div class="notice" style="grid-column:1/-1">Produk tidak ditemukan.</div>';
    return;
  }
  productsEl.innerHTML = filtered.map(p => `
    <article class="product">
      <div class="product-photo">${p.image ? `<img loading="lazy" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none'">` : '<span>📦</span>'}</div>
      <div class="product-info">
        <div class="product-name">${escapeHtml(p.name)}</div>
        <div class="product-desc">${escapeHtml(p.description || 'Pesanan Anda siap kami antar ke rumah dalam waktu sekitar ±1 jam setelah pembayaran dikonfirmasi.')}</div>
        <div class="price">${escapeHtml(formatPrice(p.price))}</div>
        <div class="actions">
          <button class="wa" data-action="wa" data-id="${p.id}" aria-label="Tanya WhatsApp">☏</button>
          <button class="cart" data-action="cart" data-id="${p.id}" aria-label="Tambah keranjang">🛒</button>
          <button class="buy" data-action="buy" data-id="${p.id}">Beli</button>
        </div>
      </div>
    </article>`).join('');
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function updateCart() {
  document.getElementById('cartCount').textContent = cart.reduce((sum,item)=>sum+item.qty,0);
  localStorage.setItem('tsa_cart', JSON.stringify(cart));
}
function openWhatsApp(p, intro='Halo, saya ingin pesan: ') {
  const message = intro + p.name + ' — ' + formatPrice(p.price);
  window.open('https://wa.me/?text=' + encodeURIComponent(message), '_blank');
}
productsEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const p = allProducts.find(item => item.id === btn.dataset.id);
  if (!p) return;
  if (btn.dataset.action === 'wa') openWhatsApp(p, 'Halo, saya mau tanya produk: ');
  if (btn.dataset.action === 'buy') openWhatsApp(p);
  if (btn.dataset.action === 'cart') {
    const existing = cart.find(item=>item.id===p.id);
    if (existing) existing.qty++;
    else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
    updateCart();
    btn.textContent = '✓';
    setTimeout(()=>{if(btn.isConnected)btn.textContent='🛒'},700);
  }
});
searchInput.addEventListener('input', renderProducts);
document.getElementById('categories').addEventListener('click',e=>{
  const btn=e.target.closest('[data-cat]'); if(!btn)return;
  if(btn.dataset.cat==='__menu'){ alert('Pilih kategori produk atau gunakan pencarian.'); return; }
  activeCategory=btn.dataset.cat;
  document.querySelectorAll('.cat').forEach(el=>el.classList.toggle('active',el===btn));
  renderProducts();
});
document.getElementById('refresh').onclick=()=>location.reload();
document.getElementById('homeBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('cartBtn').onclick=()=>{
  if(!cart.length){alert('Keranjang masih kosong.');return;}
  const msg='Pesanan Toko Siap Antar:\n'+cart.map((x,i)=>`${i+1}. ${x.name} — ${x.qty} pcs`).join('\n');
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
};
document.getElementById('historyBtn').onclick=()=>alert('Riwayat pesanan akan tersedia melalui akun Anda.');
document.getElementById('profileBtn').onclick=()=>alert('Silakan hubungi admin untuk akses profil/member.');
document.getElementById('facebook').onclick=e=>{e.preventDefault();alert('Tambahkan tautan Facebook toko pada HTML.');};
document.getElementById('instagram').onclick=e=>{e.preventDefault();alert('Tambahkan tautan Instagram toko pada HTML.');};
document.getElementById('whatsapp').onclick=e=>{e.preventDefault();window.open('https://wa.me/','_blank');};
document.getElementById('theme').onclick=()=>{
  const dark=document.body.dataset.theme!=='dark';
  document.body.dataset.theme=dark?'dark':'light';
  document.body.style.background=dark?'#1d1d1d':'var(--paper)';
  document.body.style.color=dark?'#f4f4f4':'var(--ink)';
  document.querySelectorAll('.quick-wrap').forEach(el=>el.style.background=dark?'#1d1d1d':'var(--paper)');
  document.querySelectorAll('.product').forEach(el=>el.style.background=dark?'#292929':'var(--card)');
  document.getElementById('theme').textContent=dark?'☀':'☾';
};
function parseGviz(raw) {
  const start=raw.indexOf('{'), end=raw.lastIndexOf('}');
  if(start<0||end<start) throw new Error('Format data Google Sheets tidak dikenali.');
  return JSON.parse(raw.slice(start,end+1));
}
fetch(SHEET_URL, {cache:'no-store'})
.then(res=>{if(!res.ok)throw new Error('HTTP '+res.status);return res.text();})
.then(raw=>{
  const json=parseGviz(raw);
  const rows=json.table && json.table.rows;
  if(!rows)throw new Error('Tab spreadsheet tidak memiliki data yang bisa dibaca.');
  allProducts=rows.map((row,index)=>{
    const c=row.c||[];
    const name=c[1]?.v ?? c[0]?.v ?? '';
    const description=c[2]?.v ?? '';
    const price=c[3]?.v ?? '';
    const image=convertImage(c[4]?.v ?? '');
    return {id:String(index),name:String(name).trim(),description:String(description).trim(),price,image,searchText:(String(name)+' '+String(description)).toLowerCase()};
  }).filter(p=>p.name);
  if(!allProducts.length)throw new Error('Tidak ada produk pada tab spreadsheet yang dipilih.');
  renderProducts();
})
.catch(err=>{
  productsEl.innerHTML='<div class="notice" style="grid-column:1/-1;color:#b42318">Produk gagal dimuat: '+escapeHtml(err.message)+'. Pastikan tab spreadsheet yang dipakai benar dan aksesnya publik.</div>';
});
updateCart();
</script>
</body>
</html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00a85a"><title>Penugasan Mitra | Toko Siap Antar</title><style>:root{--g:#00a85a;--c:#00c8a0;--y:#ffd400;--ink:#18312b;--muted:#66756f;--line:#dceee5}*{box-sizing:border-box}body{margin:0;background:#f4fff7;color:var(--ink);font:15px Arial,sans-serif;padding-bottom:30px}header{background:#fff;border-bottom:2px solid var(--y);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}header img{width:48px;height:44px;object-fit:contain}header strong{color:#008b4c;font-size:17px}header small{display:block;color:var(--muted);font-size:12px;margin-top:3px}main{max-width:900px;margin:auto;padding:16px 12px}.title{margin:4px 0;font-size:23px}.sub,.muted{color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 7px #18312b08}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf4ef;flex-wrap:wrap}.row:last-child{border-bottom:0}.btn{border:0;border-radius:10px;padding:11px 13px;background:linear-gradient(100deg,var(--g),var(--c));color:white;font-weight:700;cursor:pointer}.btn2{border:1px solid #b9e5ce;background:#effbf3;color:#087b45;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.danger{background:#fff0ed;color:#b42318;border:0;border-radius:9px;padding:9px 11px}input,select{display:block;width:100%;border:1px solid #cfe5d8;border-radius:10px;padding:12px;font:inherit;margin:7px 0 12px;background:#fff;color:var(--ink)}label{font-weight:700;font-size:13px}.note{padding:12px;border-radius:10px;background:#eef7ff;margin:10px 0;font-size:13px}.ok{background:#e5fff0;color:#087b45}.err{background:#fff0ed;color:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#fff7ce;font-size:12px;font-weight:700}.full{width:100%}a{color:#008b4c}@media(max-width:480px){.title{font-size:20px}.card{padding:12px}}</style></head><body><header><img src="logo3.png" alt="Logo Toko Siap Antar"><div><strong>Toko Siap Antar</strong><small>Panel mitra pengantaran</small></div></header><main><h1 class="title">🧭 Penugasan Mitra Antar</h1><p class="sub">Khusus admin. Tugaskan pesanan kepada mitra terdaftar atau teruskan detail order ke WhatsApp.</p><div id="msg"></div><section id="denied" class="card" hidden>Memeriksa akses admin…</section><section id="panel" hidden><div class="card"><div class="row"><b>Pesanan untuk ditugaskan</b><button id="refresh" class="btn2">Muat ulang</button></div><div class="muted">Daftar mitra dibaca dari koleksi <code>users</code> dengan role <code>mitra</code>.</div></div><div id="orders"></div></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,query,where,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';const firebaseConfig={apiKey:"AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",authDomain:"teknisi-ponsel-maja.firebaseapp.com",projectId:"teknisi-ponsel-maja",storageBucket:"teknisi-ponsel-maja.firebasestorage.app",messagingSenderId:"835618012205",appId:"1:835618012205:web:95e41095d1a56c761d4ca4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');let drivers=[],orders=[];
function msg(t,err=false){$('msg').innerHTML=`<div class="note ${err?'err':'ok'}">${esc(t)}</div>`}
onAuthStateChanged(auth,async u=>{if(!u){$('denied').hidden=false;$('denied').textContent='Login superadmin diperlukan. Buka halaman admin dan login dahulu.';return}try{const us=await getDoc(doc(db,'users',u.uid));if(!us.exists()||us.data().role!=='superadmin'){$('denied').hidden=false;$('denied').textContent='Akses ditolak. Halaman ini khusus superadmin.';return}$('panel').hidden=false;await load()}catch(e){msg('Gagal memeriksa akses: '+e.message,true)}});$('refresh').onclick=load;
async function load(){try{const [os,us]=await Promise.all([getDocs(collection(db,'orders')),getDocs(query(collection(db,'users'),where('role','==','mitra')))]);orders=os.docs.map(d=>({id:d.id,...d.data()})).filter(o=>!['SELESAI','DITOLAK','DIBATALKAN'].includes(String(o.status||'').toUpperCase()));drivers=us.docs.map(d=>({uid:d.id,...d.data()}));render()}catch(e){msg('Tidak dapat memuat order/mitra. Periksa rules Firestore. '+e.message,true)}}
function render(){$('orders').innerHTML=orders.length?orders.map(o=>`<article class="card"><div class="row"><b>${esc(o.nomorPesanan||o.id)}</b><span class="badge">${esc(o.statusPengantaran||o.status||'MENUNGGU')}</span></div><p><b>Penerima:</b> ${esc(o.alamatPengiriman?.nama||o.ownerName||'Pelanggan')} · ${esc(o.alamatPengiriman?.telepon||'-')}</p><p><b>Alamat:</b> ${esc(o.alamatPengiriman?.alamat||'Belum ada alamat')}</p><p><b>Total:</b> ${money(o.total)} · <b>Metode:</b> ${esc(o.metodePembayaran||'-')}</p><label>Pilih mitra</label><select id="driver-${esc(o.id)}"><option value="">-- Pilih mitra --</option>${drivers.map(d=>`<option value="${esc(d.uid)}" ${o.mitraUid===d.uid?'selected':''}>${esc(d.nama||d.displayName||d.email||d.uid)} (${esc(d.email||'')})</option>`).join('')}</select><div class="grid"><button class="btn" data-action="assign" data-id="${esc(o.id)}">Tugaskan mitra</button><button class="btn2" data-action="wa" data-id="${esc(o.id)}">Kirim detail via WhatsApp</button></div>${o.mitraUid?`<p class="muted">Mitra UID: ${esc(o.mitraUid)} · Status pengantaran: ${esc(o.statusPengantaran||'Belum diperbarui')}</p>`:''}</article>`).join(''):'<div class="card">Tidak ada pesanan aktif.</div>';if(!drivers.length)msg('Belum ada akun mitra. Buat akun melalui Firebase Authentication lalu tambahkan dokumen users/{UID} dengan role="mitra" dan nama/telepon.',true)}
$('orders').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const o=orders.find(x=>x.id===b.dataset.id);if(!o)return;if(b.dataset.action==='wa'){const phone=String(o.alamatPengiriman?.telepon||'').replace(/\D/g,'').replace(/^0/,'62');const text=`Pesanan Toko Siap Antar: ${o.nomorPesanan||o.id}%0A${(o.items||[]).map(i=>`${i.nama||i.name} x${i.qty}`).join('%0A')}%0ATotal: ${money(o.total)}%0APenerima: ${o.alamatPengiriman?.nama||o.ownerName||'Pelanggan'}%0AAlamat: ${o.alamatPengiriman?.alamat||'-'}`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(decodeURIComponent(text)),'_blank');return}const uid=$('driver-'+o.id).value;if(!uid){msg('Pilih mitra terlebih dahulu.',true);return}const d=drivers.find(x=>x.uid===uid);if(!confirm('Tugaskan '+(d?.nama||d?.email||uid)+' untuk '+(o.nomorPesanan||o.id)+'?'))return;b.disabled=true;try{await updateDoc(doc(db,'orders',o.id),{mitraUid:uid,mitraNama:d?.nama||d?.displayName||d?.email||'Mitra',statusPengantaran:'DITUGASKAN',assignedAt:serverTimestamp(),assignedBy:auth.currentUser.uid,updatedAt:serverTimestamp()});msg('Pesanan berhasil ditugaskan. Mitra dapat melihatnya di mitra.html.');await load()}catch(x){msg('Gagal menugaskan. Pastikan rules orders mengizinkan superadmin mengubah pesanan. '+x.message,true);b.disabled=false}});
</script></body></html>
